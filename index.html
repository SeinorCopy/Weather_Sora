<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  
  <title>SORA HK · 天文台預警</title>

  <link rel="icon" type="image/jpeg" href="favicon.jpeg">
  <link rel="apple-touch-icon" href="apple-touch-icon.jpeg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <meta property="og:title" content="SORA HK · 天文台預警">
  <meta property="og:description" content="香港天文台惡劣天氣警告即時監測">
  <meta property="og:image" content="sora_bird_typhoon.jpeg">
  <meta property="og:type" content="website">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      transition: background 0.5s ease;
    }

    body.rainy-bg {
      background: #2c3e50;
    }

    body.typhoon-bg {
      background: #1a1a2e;
    }

    .weather-card {
      max-width: 480px;
      width: 100%;
      background: #f5f7fa;
      border-radius: 32px;
      padding: 28px 26px 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
      color: #3d525c;
      transition: all 0.3s ease;
      border: 1px solid rgba(180, 195, 210, 0.2);
      position: relative;
      overflow: hidden;
      z-index: 2;
    }

    /* ===== 🌧️ 落雨動畫 ===== */
    .rain-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .rain-container.active {
      opacity: 1;
    }

    .rain-drop {
      position: absolute;
      top: -20px;
      width: 2px;
      background: rgba(174, 194, 224, 0.6);
      animation: rainFall linear infinite;
      border-radius: 2px;
    }

    @keyframes rainFall {
      0% {
        transform: translateY(-20px) rotate(10deg);
        opacity: 1;
      }
      100% {
        transform: translateY(110vh) rotate(10deg);
        opacity: 0.2;
      }
    }

    /* ===== 🌬️ 打風動畫 ===== */
    .typhoon-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 1;
      transition: opacity 1.5s ease;
      overflow: hidden;
    }

    .typhoon-overlay.active {
      opacity: 1;
    }

    .wind-line {
      position: absolute;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      animation: windBlow linear infinite;
    }

    @keyframes windBlow {
      0% {
        transform: translateX(-200px) scaleX(0.5);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        transform: translateX(calc(100vw + 200px)) scaleX(1.5);
        opacity: 0;
      }
    }

    .typhoon-spiral {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.03);
      animation: spiralRotate 20s linear infinite;
      transform: translate(-50%, -50%);
    }

    .typhoon-spiral:nth-child(2) {
      width: 450px;
      height: 450px;
      animation-duration: 30s;
      animation-direction: reverse;
    }

    .typhoon-spiral:nth-child(3) {
      width: 600px;
      height: 600px;
      animation-duration: 40s;
    }

    @keyframes spiralRotate {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes shake {
      0%, 100% { transform: rotate(0deg) translateX(0); }
      10% { transform: rotate(1deg) translateX(3px); }
      20% { transform: rotate(-1.5deg) translateX(-4px); }
      30% { transform: rotate(1.2deg) translateX(3px); }
      40% { transform: rotate(-0.8deg) translateX(-2px); }
      50% { transform: rotate(0.5deg) translateX(1px); }
      60% { transform: rotate(-0.3deg) translateX(-1px); }
      70% { transform: rotate(0.2deg) translateX(0); }
      80% { transform: rotate(-0.1deg) translateX(0); }
      90% { transform: rotate(0.1deg) translateX(0); }
    }

    .hero-image.shake {
      animation: shake 0.8s ease-in-out infinite;
    }

    .hero-image img {
      transition: opacity 0.8s ease, transform 0.8s ease;
      width: 100%;
      height: auto;
      display: block;
    }

    /* ===== 頂部 ===== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .update-time-top {
      font-size: 0.7rem;
      color: #8a9ba8;
      letter-spacing: 0.5px;
      font-weight: 400;
    }

    .warning-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .warning-badge-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .warning-badge-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .warning-badge-temp {
      font-size: 1.0rem;
      font-weight: 600;
      color: #3d525c;
      letter-spacing: 0.3px;
    }

    .warning-badge-temp .temp-unit {
      font-size: 0.7rem;
      font-weight: 400;
      color: #8a9ba8;
    }

    .city-section {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-top: 2px;
      margin-bottom: 12px;
    }

    .city-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.6rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #3d525c;
    }

    .city-name i {
      color: #7a9bb5;
      font-size: 1.1rem;
    }

    .hero-image {
      width: 100%;
      border-radius: 24px;
      overflow: hidden;
      margin: 10px 0 18px;
      background: #eef2f6;
      border: 1px solid rgba(180, 195, 210, 0.15);
      min-height: 120px;
      position: relative;
    }

    /* ===== ⭐ 特別天氣提示 ===== */
    #specialTipContainer {
      background: #f0f4f8;
      border-radius: 16px;
      padding: 12px 16px;
      margin: 8px 0 12px;
      border-left: 4px solid #7a9bb5;
      font-size: 0.85rem;
      color: #3d525c;
      transition: all 0.3s ease;
    }

    #specialTipContainer .tip-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #specialTipContainer .tip-label {
      font-weight: 500;
    }

    #specialTipContainer .tip-time {
      font-size: 0.65rem;
      color: #8a9ba8;
    }

    #specialTipContainer .tip-body {
      margin-top: 4px;
      line-height: 1.5;
    }

    /* ===== 警報框（8號風球橙色） ===== */
    .news-alert {
      border-radius: 16px;
      padding: 14px 18px;
      margin: 12px 0 18px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.3s ease;
    }

    .news-alert-none {
      background: #e8f5e9;
      border-left: 3px solid #4caf50;
      border: 1px solid rgba(76, 175, 80, 0.2);
    }
    .news-alert-none i { color: #4caf50; }
    .news-alert-none .news-title { color: #2e7d32; }

    .news-alert-black {
      background: #1a1a1a;
      border-left: 3px solid #ffd700;
      border: 1px solid rgba(255, 215, 0, 0.3);
    }
    .news-alert-black i { color: #ffd700; }
    .news-alert-black .news-title { color: #ffd700; }
    .news-alert-black .news-body { color: rgba(255, 255, 255, 0.85); }
    .news-alert-black .news-time { color: rgba(255, 255, 255, 0.4); }

    .news-alert-typhoon-8 {
      background: #2c1a0a;
      border-left: 3px solid #e67e22;
      border: 1px solid rgba(230, 126, 34, 0.3);
    }
    .news-alert-typhoon-8 i { color: #e67e22; }
    .news-alert-typhoon-8 .news-title { color: #e67e22; }
    .news-alert-typhoon-8 .news-body { color: rgba(255, 255, 255, 0.85); }
    .news-alert-typhoon-8 .news-time { color: rgba(255, 255, 255, 0.4); }

    .news-alert-typhoon-9 {
      background: #3d1a00;
      border-left: 3px solid #d35400;
      border: 1px solid rgba(211, 84, 0, 0.3);
    }
    .news-alert-typhoon-9 i { color: #d35400; }
    .news-alert-typhoon-9 .news-title { color: #d35400; }
    .news-alert-typhoon-9 .news-body { color: rgba(255, 255, 255, 0.85); }
    .news-alert-typhoon-9 .news-time { color: rgba(255, 255, 255, 0.4); }

    .news-alert-typhoon-10 {
      background: #2a0a0a;
      border-left: 3px solid #c0392b;
      border: 1px solid rgba(192, 57, 43, 0.3);
    }
    .news-alert-typhoon-10 i { color: #c0392b; }
    .news-alert-typhoon-10 .news-title { color: #c0392b; }
    .news-alert-typhoon-10 .news-body { color: rgba(255, 255, 255, 0.85); }
    .news-alert-typhoon-10 .news-time { color: rgba(255, 255, 255, 0.4); }

    .news-alert-red {
      background: #fce4e4;
      border-left: 3px solid #c0392b;
      border: 1px solid rgba(192, 57, 43, 0.2);
    }
    .news-alert-red i { color: #c0392b; }
    .news-alert-red .news-title { color: #b03a2e; }

    .news-alert-yellow {
      background: #fef9e0;
      border-left: 3px solid #f1c40f;
      border: 1px solid rgba(241, 196, 15, 0.3);
    }
    .news-alert-yellow i { color: #d4a843; }
    .news-alert-yellow .news-title { color: #b8942e; }

    .news-alert-other {
      background: #fcf8f0;
      border-left: 3px solid #d4a843;
      border: 1px solid rgba(212, 168, 67, 0.2);
    }
    .news-alert-other i { color: #d4a843; }
    .news-alert-other .news-title { color: #b8942e; }

    .news-alert i {
      font-size: 1.1rem;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .news-content {
      flex: 1;
    }

    .news-title {
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
    }

    .news-body {
      font-size: 0.85rem;
      margin-top: 4px;
      line-height: 1.5;
      font-weight: 400;
    }

    .news-time {
      font-size: 0.65rem;
      margin-top: 6px;
      text-align: right;
    }

    .news-alert-hidden {
      display: none;
    }

    .extra-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 14px 0 4px;
    }

    .extra-item {
      background: #eef2f6;
      border-radius: 20px;
      padding: 16px 8px 14px;
      text-align: center;
      border: 1px solid rgba(180, 195, 210, 0.1);
    }

    .extra-item i {
      font-size: 1.2rem;
      color: #7a9bb5;
      margin-bottom: 6px;
      display: block;
    }

    .extra-item .label {
      display: block;
      font-size: 0.7rem;
      font-weight: 300;
      color: #8a9ba8;
      letter-spacing: 0.3px;
      margin-bottom: 2px;
    }

    .extra-item .value {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 2px;
    }

    .extra-item .number {
      font-size: 1.6rem;
      font-weight: 600;
      color: #3d525c;
      line-height: 1.2;
    }

    .extra-item .unit {
      font-size: 0.75rem;
      font-weight: 300;
      color: #8a9ba8;
    }

    .footer-spacer {
      height: 4px;
    }

    @media (max-width: 450px) {
      .weather-card { padding: 20px 16px 24px; }
      .city-name { font-size: 1.3rem; }
      .hero-image { min-height: 80px; }
      .extra-item { padding: 12px 6px 10px; }
      .extra-item .number { font-size: 1.3rem; }
      .extra-item .unit { font-size: 0.65rem; }
      .warning-badge-icon { width: 28px; height: 28px; }
      .warning-badge-temp { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <!-- ===== 🌧️ 落雨動畫 Layer ===== -->
  <div class="rain-container" id="rainContainer"></div>

  <!-- ===== 🌬️ 打風動畫 Layer（已啟動） ===== -->
  <div class="typhoon-overlay active" id="typhoonOverlay">
    <div class="typhoon-spiral"></div>
    <div class="typhoon-spiral"></div>
    <div class="typhoon-spiral"></div>
  </div>

  <!-- ===== 主卡片 ===== -->
  <div class="weather-card" id="app">

    <div class="top-bar">
      <div class="update-time-top" id="updateTimeTop">
        <i class="far fa-clock" style="margin-right: 4px;"></i> 更新：11:05
      </div>
      <div class="warning-badge" id="warningBadge">
        <span class="warning-badge-temp" id="warningTemp">
          26<span class="temp-unit">°C</span>
        </span>
        <span class="warning-badge-icon" id="warningIcon">
          <img src="warning-typhoon_8.png" alt="8號風球" id="warningImage">
        </span>
      </div>
    </div>

    <div class="city-section">
      <div class="city-name">
        <i class="fas fa-location-dot"></i>
        <span id="cityDisplay">SORA HK</span>
      </div>
    </div>

    <div class="hero-image shake" id="heroImage">
      <img src="sora_bird_typhoon.jpeg" alt="SORA 鳥兒天氣 - 8號風球" id="heroImageSrc">
    </div>

    <!-- ===== ⭐ 特別天氣提示 ===== -->
    <div id="specialTipContainer">
      <div class="tip-header">
        <span class="tip-label">📢 特別天氣提示</span>
        <span class="tip-time" id="specialTipTime">🕒 2026-08-23 12:00</span>
      </div>
      <div class="tip-body" id="specialTip">
        預料熱帶氣旋紫檀會在今明兩日於北部灣一帶徘徊，然後於星期一稍後至星期二逐漸轉向東北方向移動，靠近雷州半島一帶。天文台會密切監察其動向及本地風力變化，評估星期二或星期三是否需要發出熱帶氣旋警告信號，市民請留意最新天氣消息。
      </div>
    </div>

    <div class="news-alert news-alert-typhoon-8" id="newsAlert">
      <i class="fas fa-bullhorn" id="newsIcon"></i>
      <div class="news-content">
        <div class="news-title" id="newsTitle">🌀 八號烈風或暴風信號</div>
        <div class="news-body" id="newsBody">八號烈風或暴風信號現正生效，平均風速每小時63公里或以上，請勿外出。</div>
        <div class="news-time" id="newsTime">🕒 2026-08-23 12:00</div>
      </div>
    </div>

    <div class="extra-grid">
      <div class="extra-item">
        <i class="fas fa-temperature-low"></i>
        <span class="label">體感溫度</span>
        <div class="value">
          <span class="number" id="feelsLike">26</span>
          <span class="unit">°C</span>
        </div>
      </div>
      <div class="extra-item">
        <i class="fas fa-droplet"></i>
        <span class="label">濕度</span>
        <div class="value">
          <span class="number" id="humidity">85</span>
          <span class="unit">%</span>
        </div>
      </div>
      <div class="extra-item">
        <i class="fas fa-wind"></i>
        <span class="label">風速</span>
        <div class="value">
          <span class="number" id="windSpeed">60</span>
          <span class="unit">km/h</span>
        </div>
      </div>
    </div>

    <div class="footer-spacer"></div>
  </div>

  <script>
    (function() {
      // ===== DOM refs =====
      const cityDisplay = document.getElementById('cityDisplay');
      const feelsLike = document.getElementById('feelsLike');
      const humidity = document.getElementById('humidity');
      const windSpeed = document.getElementById('windSpeed');
      const updateTimeTop = document.getElementById('updateTimeTop');
      const newsAlert = document.getElementById('newsAlert');
      const newsIcon = document.getElementById('newsIcon');
      const newsTitle = document.getElementById('newsTitle');
      const newsBody = document.getElementById('newsBody');
      const newsTime = document.getElementById('newsTime');
      const warningImage = document.getElementById('warningImage');
      const warningTemp = document.getElementById('warningTemp');
      const heroImageSrc = document.getElementById('heroImageSrc');
      const heroImage = document.getElementById('heroImage');
      const rainContainer = document.getElementById('rainContainer');
      const typhoonOverlay = document.getElementById('typhoonOverlay');
      const body = document.body;
      const specialTip = document.getElementById('specialTip');
      const specialTipTime = document.getElementById('specialTipTime');

      // ===== helpers =====
      function formatTime() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        return `${h}:${m}`;
      }

      function formatFullDate() {
        const now = new Date();
        const y = now.getFullYear();
        const mo = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        return `${y}-${mo}-${d} ${h}:${m}`;
      }

      function updateTimestamp() {
        updateTimeTop.innerHTML = `<i class="far fa-clock" style="margin-right: 4px;"></i> 更新：${formatTime()}`;
      }

      // ===== 🌧️ 生成雨滴 =====
      function createRain() {
        rainContainer.innerHTML = '';
        const dropCount = 80;
        for (let i = 0; i < dropCount; i++) {
          const drop = document.createElement('div');
          drop.className = 'rain-drop';
          const left = Math.random() * 100;
          const height = 10 + Math.random() * 25;
          const duration = 0.8 + Math.random() * 1.2;
          const delay = Math.random() * 2;
          drop.style.left = left + '%';
          drop.style.height = height + 'px';
          drop.style.animationDuration = duration + 's';
          drop.style.animationDelay = delay + 's';
          drop.style.opacity = 0.3 + Math.random() * 0.5;
          rainContainer.appendChild(drop);
        }
      }

      // ===== 🌬️ 生成風線 =====
      function createWindLines() {
        typhoonOverlay.innerHTML = '';
        for (let i = 0; i < 3; i++) {
          const spiral = document.createElement('div');
          spiral.className = 'typhoon-spiral';
          typhoonOverlay.appendChild(spiral);
        }
        const lineCount = 15;
        for (let i = 0; i < lineCount; i++) {
          const line = document.createElement('div');
          line.className = 'wind-line';
          const top = 5 + Math.random() * 90;
          const width = 30 + Math.random() * 80;
          const duration = 4 + Math.random() * 6;
          const delay = Math.random() * 8;
          line.style.top = top + '%';
          line.style.width = width + 'px';
          line.style.animationDuration = duration + 's';
          line.style.animationDelay = delay + 's';
          line.style.opacity = 0.1 + Math.random() * 0.2;
          typhoonOverlay.appendChild(line);
        }
      }

      // ===== ⭐ 特別天氣提示（用你個 Sample） =====
      async function fetchSpecialWeatherTips() {
        try {
          const sampleData = {
            "swt": [{
              "desc": "預料熱帶氣旋紫檀會在今明兩日於北部灣一帶徘徊，然後於星期一稍後至星期二逐漸轉向東北方向移動，靠近雷州半島一帶。天文台會密切監察其動向及本地風力變化，評估星期二或星期三是否需要發出熱帶氣旋警告信號，市民請留意最新天氣消息。",
              "updateTime": "2026-08-23T12:00:00+08:00"
            }]
          };
          
          await new Promise(resolve => setTimeout(resolve, 500));
          
          const data = sampleData;
          
          if (data.swt && data.swt.length > 0) {
            const firstTip = data.swt[0];
            console.log('📢 特別天氣提示：', firstTip.desc);
            
            if (specialTip) {
              specialTip.textContent = firstTip.desc;
            }
            if (specialTipTime) {
              const formattedTime = firstTip.updateTime.replace('T', ' ').slice(0, 16);
              specialTipTime.textContent = `🕒 ${formattedTime}`;
            }
            
            return firstTip;
          }
        } catch (error) {
          console.error('拎唔到特別天氣提示：', error);
        }
      }

      // ===== 更新動畫 =====
      function updateAnimation(animationType) {
        rainContainer.classList.remove('active');
        typhoonOverlay.classList.remove('active');
        heroImage.classList.remove('shake');
        body.classList.remove('rainy-bg', 'typhoon-bg');

        if (animationType === 'rain') {
          rainContainer.classList.add('active');
          body.classList.add('rainy-bg');
        } else if (animationType === 'typhoon') {
          typhoonOverlay.classList.add('active');
          heroImage.classList.add('shake');
          body.classList.add('typhoon-bg');
        }
      }

      // ===== 警告配置 =====
      const WARNING_CONFIG = {
        '黑雨': {
          warningImage: 'warning-black.png',
          heroImage: 'sora_bird_rain.jpeg',
          alertClass: 'news-alert-black',
          icon: 'fa-bullhorn',

      // ===== 更新右上角（溫度 + 警告圖標） =====
      function updateWarningBadge(warningType, temp) {
        const config = WARNING_CONFIG[warningType];
        
        if (warningTemp) {
          warningTemp.innerHTML = `${Math.round(temp)}<span class="temp-unit">°C</span>`;
        }
        
        if (config && config.warningImage) {
          warningImage.src = config.warningImage;
          warningImage.style.display = 'block';
        } else {
          warningImage.style.display = 'none';
        }
      }

      // ===== 更新中間圖片 =====
      function updateHeroImage(warningType) {
        const config = WARNING_CONFIG[warningType];
        if (config) {
          heroImageSrc.src = config.heroImage;
          heroImageSrc.alt = `SORA 鳥兒天氣 - ${warningType}`;
        } else {
          heroImageSrc.src = 'sora_bird_normal.jpeg';
          heroImageSrc.alt = 'SORA 鳥兒天氣';
        }
      }

      // ===== 更新警報框 =====
      function updateAlertBox(warningType) {
        const config = WARNING_CONFIG[warningType];
        
        newsAlert.className = 'news-alert';
        
        if (!config) {
          newsAlert.classList.add('news-alert-hidden');
          return;
        }
        
        newsAlert.classList.add(config.alertClass);
        newsIcon.className = `fas ${config.icon}`;
        newsTitle.textContent = config.title;
      }

      // ===== 更新天氣（完整功能） =====
      function updateWeather(warningType, feels, humid, wind, newsBodyText) {
        const config = WARNING_CONFIG[warningType];

        if (config) {
          updateAnimation(config.animation);
        } else {
          updateAnimation('none');
        }

        updateWarningBadge(warningType, feels);
        updateHeroImage(warningType);
        updateAlertBox(warningType);

        if (newsBodyText) {
          newsBody.textContent = newsBodyText;
        } else if (config) {
          newsBody.textContent = config.defaultBody;
        } else {
          newsBody.textContent = '目前沒有惡劣天氣警告，天氣狀況良好。';
        }

        const fullDate = formatFullDate();
        newsTime.textContent = `🕒 ${fullDate}`;

        feelsLike.textContent = Math.round(feels);
        humidity.textContent = Math.round(humid);
        windSpeed.textContent = Math.round(wind);

        updateTimestamp();
      }

      // ===== 初始化（8號風球） =====
      createRain();
      createWindLines();

      window.addEventListener('load', function() {
        // ⭐ 特別天氣提示
        fetchSpecialWeatherTips();
        setInterval(fetchSpecialWeatherTips, 600000);
        
        // 🌬️ 設定為 8號風球
        updateWeather('8號風球', 26, 85, 60);
        console.log('🌀 SORA HK · 8號風球 Demo');
      });

      window.setSORAWeather = updateWeather;
      console.log('🕊️ SORA HK 已載入 (8號風球模式)');
      console.log('📌 可呼叫 setSORAWeather(警告類型, 體感, 濕度, 風速)');
    })();
  </script>
