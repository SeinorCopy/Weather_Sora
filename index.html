<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  
  <title>SORA HK · 天文台預警</title>

  <link rel="icon" type="image/jpeg" href="favicon.jpeg">
  <link rel="apple-touch-icon" href="apple-touch-icon.jpeg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Noto+Sans+HK:wght@100;400;700&display=swap" rel="stylesheet">

  <meta property="og:title" content="SORA HK · 天文台預警">
  <meta property="og:description" content="香港天文台惡劣天氣警告即時監測">
  <meta property="og:image" content="sora_bird_normal.jpeg">
  <meta property="og:type" content="website">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #e8edf2;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      transition: background 0.5s ease;
      
      /* ===== 淡入淡出轉場 ===== */
      animation: pageFadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes pageFadeIn {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    body.page-out {
      animation: pageFadeOut 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes pageFadeOut {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-8px);
      }
    }

    body.rainy-bg {
      background: #2c3e50;
    }

    body.typhoon-bg {
      background: #2c3e50;
    }

    .weather-card {
      max-width: 480px;
      width: 100%;
      background: #f5f7fa;
      border-radius: 32px;
      padding: 28px 26px 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
      color: #3d525c;
      transition: all 0.3s ease;
      border: 1px solid rgba(180, 195, 210, 0.2);
      position: relative;
      overflow: hidden;
      z-index: 2;
    }

    /* ===== 🌧️ 落雨動畫 ===== */
    .rain-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .rain-container.active {
      opacity: 1;
    }

    .rain-drop {
      position: absolute;
      top: -20px;
      width: 2px;
      background: rgba(174, 194, 224, 0.6);
      animation: rainFall linear infinite;
      border-radius: 2px;
    }

    @keyframes rainFall {
      0% {
        transform: translateY(-20px) rotate(10deg);
        opacity: 1;
      }
      100% {
        transform: translateY(110vh) rotate(10deg);
        opacity: 0.2;
      }
    }

    /* ===== 🌬️ 打風動畫 ===== */
    .typhoon-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 1.5s ease;
      overflow: hidden;
    }

    .typhoon-overlay.active {
      opacity: 1;
    }

    .wind-line {
      position: absolute;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      animation: windBlow linear infinite;
    }

    @keyframes windBlow {
      0% {
        transform: translateX(-200px) scaleX(0.5);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        transform: translateX(calc(100vw + 200px)) scaleX(1.5);
        opacity: 0;
      }
    }

    .typhoon-spiral {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.03);
      animation: spiralRotate 20s linear infinite;
      transform: translate(-50%, -50%);
    }

    .typhoon-spiral:nth-child(2) {
      width: 450px;
      height: 450px;
      animation-duration: 30s;
      animation-direction: reverse;
    }

    .typhoon-spiral:nth-child(3) {
      width: 600px;
      height: 600px;
      animation-duration: 40s;
    }

    @keyframes spiralRotate {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes shake {
      0%, 100% { transform: rotate(0deg) translateX(0); }
      10% { transform: rotate(1deg) translateX(3px); }
      20% { transform: rotate(-1.5deg) translateX(-4px); }
      30% { transform: rotate(1.2deg) translateX(3px); }
      40% { transform: rotate(-0.8deg) translateX(-2px); }
      50% { transform: rotate(0.5deg) translateX(1px); }
      60% { transform: rotate(-0.3deg) translateX(-1px); }
      70% { transform: rotate(0.2deg) translateX(0); }
      80% { transform: rotate(-0.1deg) translateX(0); }
      90% { transform: rotate(0.1deg) translateX(0); }
    }

    .hero-image.shake {
      animation: shake 0.8s ease-in-out infinite;
    }

    .hero-image img {
      transition: opacity 0.8s ease, transform 0.8s ease;
      width: 100%;
      height: auto;
      display: block;
    }

    /* ===== 頂部 ===== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .update-time-top {
      font-size: 0.7rem;
      color: #8a9ba8;
      letter-spacing: 0.5px;
      font-weight: 400;
    }

    .warning-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .warning-badge-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .warning-badge-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .warning-badge-temp {
      font-size: 1.0rem;
      font-weight: 600;
      color: #3d525c;
      letter-spacing: 0.3px;
    }

    .warning-badge-temp .temp-unit {
      font-size: 0.7rem;
      font-weight: 400;
      color: #8a9ba8;
    }

    .city-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2px;
      margin-bottom: 12px;
    }
    
    .city-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #096a99;
      font-family: 'Montserrat', sans-serif;
    }
    
    .city-name i {
      color: #7a9bb5;
      font-size: 1.1rem;
    }
    
    /* ===== 🌪️ 風暴檔案按鈕 ===== */
    .storm-archive-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #eef2f6;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(180, 195, 210, 0.2);
      color: #3d525c;
      padding: 8px 18px 8px 16px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: 12px;
      letter-spacing: 0.3px;
    }
    
    .storm-archive-btn i {
      color: #7a9bb5;
      font-size: 0.85rem;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .storm-archive-btn .fa-skull {
      animation: skullFloat 3s ease-in-out infinite;
    }
    
    @keyframes skullFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-2px) rotate(-3deg); }
    }
    
    .storm-archive-btn:hover {
      background: #e2e8ef;
      border-color: rgba(122, 155, 181, 0.3);
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 25px rgba(122, 155, 181, 0.1);
    }
    
    .storm-archive-btn:hover i {
      color: #5a7a8a;
      transform: rotate(-8deg) scale(1.15);
      animation: none;
    }
    
    .storm-archive-btn:active {
      transform: scale(0.95);
    }

    .hero-image {
      width: 100%;
      border-radius: 24px;
      overflow: hidden;
      margin: 10px 0 8px;
      background: #eef2f6;
      border: 1px solid rgba(180, 195, 210, 0.15);
      min-height: 120px;
      position: relative;
    }

    /* ===== 🌧️ 降雨分佈按鈕 (長期顯示) ===== */
    .rain-btn-wrapper {
      text-align: center;
      margin: 2px 0 14px;
      min-height: 52px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .rain-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #3d525c;
      padding: 10px 24px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .rain-btn:hover {
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 8px 30px rgba(56, 189, 248, 0.15);
      transform: translateY(-2px) scale(1.02);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .rain-btn:active {
      transform: scale(0.96);
    }

    .rain-btn i {
      font-size: 1rem;
    }

    .rain-btn .btn-icon {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .rain-btn .raindrop {
      display: inline-block;
      animation: dropFloat 1.8s ease-in-out infinite;
    }

    .rain-btn .raindrop:nth-child(2) { animation-delay: 0.3s; }
    .rain-btn .raindrop:nth-child(3) { animation-delay: 0.6s; }

    @keyframes dropFloat {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 1; }
      50% { transform: translateY(-4px) scale(1.1); opacity: 0.7; }
    }

    .rain-btn .btn-arrow {
      transition: transform 0.3s ease;
    }

    .rain-btn:hover .btn-arrow {
      transform: translateX(4px);
    }

    /* ===== ⭐ 特別天氣提示 ===== */
    #specialTipContainer {
      background: #f0f4f8;
      border-radius: 16px;
      padding: 12px 16px;
      margin: 8px 0 12px;
      border-left: 4px solid #7a9bb5;
      font-size: 0.85rem;
      color: #3d525c;
      transition: all 0.3s ease;
    }

    #specialTipContainer .tip-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #specialTipContainer .tip-label { font-weight: 500; }
    #specialTipContainer .tip-time { font-size: 0.65rem; color: #8a9ba8; }
    #specialTipContainer .tip-body { margin-top: 4px; line-height: 1.5; }

    /* ===== 警報框 ===== */
    .news-alert {
      border-radius: 16px;
      padding: 14px 18px;
      margin: 12px 0 18px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.3s ease;
    }

    .news-alert-none {
      background: #e8f5e9;
      border-left: 3px solid #4caf50;
      border: 1px solid rgba(76, 175, 80, 0.2);
    }
    .news-alert-none i { color: #4caf50; }
    .news-alert-none .news-title { color: #2e7d32; }

    .news-alert-black {
      background: #1a1a1a;
      border-left: 3px solid #ffd700;
      border: 1px solid rgba(255, 215, 0, 0.3);
    }
    .news-alert-black i { color: #ffd700; }
    .news-alert-black .news-title { color: #ffd700; }
    .news-alert-black .news-body { color: rgba(255, 255, 255, 0.85); }
    .news-alert-black .news-time { color: rgba(255, 255, 255, 0.4); }

    .news-alert-typhoon-8 {
      background: #1a2a3a;
      border-left: 3px solid #e67e22;
      border: 1px solid rgba(230, 126, 34, 0.25);
    }
    .news-alert-typhoon-8 i { color: #e67e22; }
    .news-alert-typhoon-8 .news-title { color: #e67e22; }
    .news-alert-typhoon-8 .news-body { color: #d0d8e0; }
    .news-alert-typhoon-8 .news-time { color: rgba(255, 255, 255, 0.3); }

    .news-alert-typhoon-9 {
      background: #1a1a2e;
      border-left: 3px solid #d35400;
      border: 1px solid rgba(211, 84, 0, 0.25);
    }
    .news-alert-typhoon-9 i { color: #d35400; }
    .news-alert-typhoon-9 .news-title { color: #d35400; }
    .news-alert-typhoon-9 .news-body { color: rgba(255, 255, 255, 0.85); }
    .news-alert-typhoon-9 .news-time { color: rgba(255, 255, 255, 0.3); }

    .news-alert-typhoon-10 {
      background: #1a0a0a;
      border-left: 3px solid #c0392b;
      border: 1px solid rgba(192, 57, 43, 0.25);
    }
    .news-alert-typhoon-10 i { color: #c0392b; }
    .news-alert-typhoon-10 .news-title { color: #c0392b; }
    .news-alert-typhoon-10 .news-body { color: rgba(255, 255, 255, 0.85); }
    .news-alert-typhoon-10 .news-time { color: rgba(255, 255, 255, 0.3); }

    .news-alert-red {
      background: #fce4e4;
      border-left: 3px solid #c0392b;
      border: 1px solid rgba(192, 57, 43, 0.2);
    }
    .news-alert-red i { color: #c0392b; }
    .news-alert-red .news-title { color: #b03a2e; }

    .news-alert-yellow {
      background: #fef9e0;
      border-left: 3px solid #f1c40f;
      border: 1px solid rgba(241, 196, 15, 0.3);
    }
    .news-alert-yellow i { color: #d4a843; }
    .news-alert-yellow .news-title { color: #b8942e; }

    .news-alert-thunderstorm{
      background: #f0f5c9;
      border-left: 3px solid #fa5437;
      border: 1px solid rgba(212, 168, 67, 0.2);
    }

    .news-alert-hot{
      background: #fcb1cc;
      border-left: 3px solid #fa5437;
      border: 1px solid rgba(212, 168, 67, 0.2);
    }

    .news-alert-cold{
      background: #c3f6f7;
      border-left: 3px solid #fa5437;
      border: 1px solid rgba(212, 168, 67, 0.2);
    }

    .news-alert-other {
      background: #fcf8f0;
      border-left: 3px solid #d4a843;
      border: 1px solid rgba(212, 168, 67, 0.2);
    }
    .news-alert-other i { color: #d4a843; }
    .news-alert-other .news-title { color: #b8942e; }

    .news-alert i {
      font-size: 1.1rem;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .news-content { flex: 1; }
    .news-title { font-weight: 600; font-size: 0.9rem; letter-spacing: 0.3px; }
    .news-body { font-size: 0.85rem; margin-top: 4px; line-height: 1.5; font-weight: 400; }
    .news-time { font-size: 0.65rem; margin-top: 6px; text-align: right; }
    .news-alert-hidden { display: none; }

    .extra-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 14px 0 4px;
    }

    .extra-item {
      background: #eef2f6;
      border-radius: 20px;
      padding: 16px 8px 14px;
      text-align: center;
      border: 1px solid rgba(180, 195, 210, 0.1);
    }

    .extra-item i {
      font-size: 1.2rem;
      color: #7a9bb5;
      margin-bottom: 6px;
      display: block;
    }

    .extra-item .label {
      display: block;
      font-size: 0.7rem;
      font-weight: 300;
      color: #8a9ba8;
      letter-spacing: 0.3px;
      margin-bottom: 2px;
    }

    .extra-item .value {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 3px;
    }

    .extra-item .number {
      font-size: 1.5rem;
      font-weight: 600;
      color: #3d525c;
      line-height: 1.2;
    }

    .extra-item .unit {
      font-size: 0.75rem;
      font-weight: 400;
      color: #8a9ba8;
    }

    .footer-spacer { height: 4px; }
    
    .weather-footer {
      text-align: center;
      font-size: 0.6rem;
      color: #888888;
      margin-top: 30px;
      padding-bottom: 5px;
      letter-spacing: 0.5px;
    }

    @media (max-width: 450px) {
      .weather-card { padding: 20px 16px 24px; }
      .city-name { font-size: 1rem; }
      .hero-image { min-height: 80px; }
      .extra-item { padding: 12px 6px 10px; }
      .extra-item .number { font-size: 1.3rem; }
      .extra-item .unit { font-size: 0.65rem; }
      .warning-badge-icon { width: 28px; height: 28px; }
      .warning-badge-temp { font-size: 0.85rem; }
      .rain-btn { padding: 8px 16px; font-size: 0.8rem; }
      .storm-archive-btn { font-size: 0.7rem; padding: 6px 12px 6px 10px; gap: 5px; margin-left: 8px; }
      .storm-archive-btn i { font-size: 0.75rem; }
    }
  </style>
</head>
<body>

  <!-- ===== 🌧️ 落雨動畫 Layer ===== -->
  <div class="rain-container" id="rainContainer"></div>

  <!-- ===== 🌬️ 打風動畫 Layer ===== -->
  <div class="typhoon-overlay" id="typhoonOverlay">
    <div class="typhoon-spiral"></div>
    <div class="typhoon-spiral"></div>
    <div class="typhoon-spiral"></div>
  </div>

  <!-- ===== 主卡片 ===== -->
  <div class="weather-card" id="app">

    <div class="top-bar">
      <div class="update-time-top" id="updateTimeTop">
        <i class="far fa-clock" style="margin-right: 4px;"></i> 更新：載入中...
      </div>
      <div class="warning-badge" id="warningBadge">
        <span class="warning-badge-temp" id="warningTemp">
          --<span class="temp-unit">°C</span>
        </span>
        <span class="warning-badge-icon" id="warningIcon">
          <img src="warning-black.png" alt="警告圖標" id="warningImage" style="display:none;">
        </span>
      </div>
    </div>
    
    <div class="city-section">
      <div class="city-name">
        <i class="fas fa-location-dot"></i>
        <span id="cityDisplay">SORA HK</span>
      </div>
      <a href="typhoon-history.html" class="storm-archive-btn">
        <i class="fas fa-skull"></i> 風暴檔案
      </a>
    </div>

    <div class="hero-image" id="heroImage">
      <img src="sora_bird_normal.jpeg" alt="SORA 鳥兒天氣" id="heroImageSrc">
    </div>

    <!-- ===== 🌧️ 降雨分佈按鈕 (長期顯示) ===== -->
    <div class="rain-btn-wrapper">
      <button class="rain-btn" id="rainBtn">
        <span class="btn-icon">
          <span class="raindrop">🌧️</span>
          <span class="raindrop">💧</span>
          <span class="raindrop">🌧️</span>
        </span>
        降雨分佈
        <i class="fa-solid fa-arrow-right btn-arrow"></i>
      </button>
    </div>

    <!-- ===== ⭐ 特別天氣提示 ===== -->
    <div id="specialTipContainer">
      <div class="tip-header">
        <span class="tip-label">📢 特別天氣提示</span>
        <span class="tip-time" id="specialTipTime"> </span>
      </div>
      <div class="tip-body" id="specialTip">
        載入中...
      </div>
    </div>

    <div class="news-alert" id="newsAlert">
      <i class="fas fa-bullhorn" id="newsIcon"></i>
      <div class="news-content">
        <div class="news-title" id="newsTitle">⚠️ 天文台天氣警報</div>
        <div class="news-body" id="newsBody">載入中...</div>
        <div class="news-time" id="newsTime"> </div>
      </div>
    </div>

    <div class="extra-grid">
      <!-- 1. 紫外線區塊 -->
      <div class="extra-item">
        <i class="fas fa-sun"></i>
        <span class="label">紫外線指數</span>
        <div class="value">
          <span class="number" id="uvValue">--</span>
          <span class="unit" id="uvDesc">--</span>
        </div>
      </div>
      <!-- 2. 濕度區塊 -->
      <div class="extra-item">
        <i class="fas fa-droplet"></i>
        <span class="label">濕度</span>
        <div class="value">
          <span class="number" id="humidity">--</span>
          <span class="unit">%</span>
        </div>
      </div>
      <!-- 3. 風速區塊 -->
      <div class="extra-item">
        <i class="fas fa-wind"></i>
        <span class="label">風速(維修)</span>
        <div class="value">
          <span class="number" id="windSpeed">--</span>
          <span class="unit">km/h</span>
        </div>
      </div>
    </div>

    <div class="footer-spacer"></div>
    <footer class="weather-footer">
      <div>系統每 5 分鐘自動更新</div>
      <div>資料來源：香港天文台</div>
    </footer>
  </div>

      <!-- 降雨地圖 Modal 視窗 -->
    <div id="rainModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 999; justify-content: center; align-items: center; padding: 16px;">
        <div style="width: 100%; max-width: 480px; height: 90vh; background: #f5f7fa; border-radius: 28px; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column;">
            <!-- 頂部關閉列 -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: #eef2f6; border-bottom: 1px solid rgba(180, 195, 210, 0.2);">
                <span style="font-weight: 500; color: #3d525c; font-size: 0.95rem;"><i class="fa-solid fa-cloud-rain" style="color: #7a9bb5; margin-right: 6px;"></i> 即時降雨分佈</span>
                <button id="closeRainModal" style="background: none; border: none; font-size: 1.2rem; color: #8a9ba8; cursor: pointer;">&times;</button>
            </div>
            <!-- 地圖內容 -->
            <iframe src="rain-map.html" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
    </div>

  

<script>
  (function() {
    // ===== DOM refs =====
    var cityDisplay = document.getElementById('cityDisplay');
    var uvValueEl = document.getElementById('uvValue');
    var uvDescEl = document.getElementById('uvDesc');
    var humidity = document.getElementById('humidity');
    var windSpeed = document.getElementById('windSpeed');
    
    var updateTimeTop = document.getElementById('updateTimeTop');
    var newsAlert = document.getElementById('newsAlert');
    var newsIcon = document.getElementById('newsIcon');
    var newsTitle = document.getElementById('newsTitle');
    var newsBody = document.getElementById('newsBody');
    var newsTime = document.getElementById('newsTime');
    var warningImage = document.getElementById('warningImage');
    var warningTemp = document.getElementById('warningTemp');
    var heroImageSrc = document.getElementById('heroImageSrc');
    var heroImage = document.getElementById('heroImage');
    var rainContainer = document.getElementById('rainContainer');
    var typhoonOverlay = document.getElementById('typhoonOverlay');
    var body = document.body;
    var specialTip = document.getElementById('specialTip');
    var specialTipTime = document.getElementById('specialTipTime');
    var rainBtn = document.getElementById('rainBtn');

    // ===== 真實數據變數 =====
    var currentTemp = 0;
    var currentHumid = 0;
    var currentWind = 0;
    var currentUV = '--';
    var currentUVdesc = '';
    var currentWarning = '晴朗';

    // ===== 🌀 轉場：撳掣去 rain-map ===== 
    // ===== 🌀 撳掣去 rain-map Modal 彈出邏輯 ===== 20260829
    var rainModal = document.getElementById('rainModal');
    var closeRainModal = document.getElementById('closeRainModal');
    
    rainBtn.addEventListener('click', function() {
      rainModal.style.display = 'flex';
    });
    
    closeRainModal.addEventListener('click', function() {
      rainModal.style.display = 'none';
    });
    
    // 點擊背景遮罩關閉
    rainModal.addEventListener('click', function(e) {
      if (e.target === rainModal) {
        rainModal.style.display = 'none';
      }
    });

    // ===== helpers =====
    function formatTime() {
      var now = new Date();
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      return h + ':' + m;
    }
    function formatFullDate() {
      var now = new Date();
      var y = now.getFullYear();
      var mo = String(now.getMonth() + 1).padStart(2, '0');
      var d = String(now.getDate()).padStart(2, '0');
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      return y + '-' + mo + '-' + d + ' ' + h + ':' + m;
    }
    function updateTimestamp() {
      updateTimeTop.innerHTML = '<i class="far fa-clock" style="margin-right: 4px;"></i> 更新：' + formatTime();
    }

    // ===== 🌧️ 生成雨滴 =====
    function createRain() {
      rainContainer.innerHTML = '';
      var dropCount = 80;
      for (var i = 0; i < dropCount; i++) {
        var drop = document.createElement('div');
        drop.className = 'rain-drop';
        var left = Math.random() * 100;
        var height = 10 + Math.random() * 25;
        var duration = 0.8 + Math.random() * 1.2;
        var delay = Math.random() * 2;
        drop.style.left = left + '%';
        drop.style.height = height + 'px';
        drop.style.animationDuration = duration + 's';
        drop.style.animationDelay = delay + 's';
        drop.style.opacity = 0.3 + Math.random() * 0.5;
        rainContainer.appendChild(drop);
      }
    }

    // ===== 🌬️ 生成風線 =====
    function createWindLines() {
      typhoonOverlay.innerHTML = '';
      for (var i = 0; i < 3; i++) {
        var spiral = document.createElement('div');
        spiral.className = 'typhoon-spiral';
        typhoonOverlay.appendChild(spiral);
      }
      var lineCount = 15;
      for (var j = 0; j < lineCount; j++) {
        var line = document.createElement('div');
        line.className = 'wind-line';
        var top = 5 + Math.random() * 90;
        var width = 30 + Math.random() * 80;
        var duration = 4 + Math.random() * 6;
        var delay = Math.random() * 8;
        line.style.top = top + '%';
        line.style.width = width + 'px';
        line.style.animationDuration = duration + 's';
        line.style.animationDelay = delay + 's';
        line.style.opacity = 0.1 + Math.random() * 0.2;
        typhoonOverlay.appendChild(line);
      }
    }

    // ===== 更新動畫 =====
    function updateAnimation(animationType) {
      rainContainer.classList.remove('active');
      typhoonOverlay.classList.remove('active');
      heroImage.classList.remove('shake');
      body.classList.remove('rainy-bg', 'typhoon-bg');
      if (animationType === 'rain') {
        rainContainer.classList.add('active');
        body.classList.add('rainy-bg');
      } else if (animationType === 'typhoon') {
        typhoonOverlay.classList.add('active');
        heroImage.classList.add('shake');
        body.classList.add('typhoon-bg');
      }
    }

    // ===== 警告配置 =====
    var WARNING_CONFIG = {
      '黑雨': {
        warningImage: 'warning-black.png',
        heroImage: 'sora_bird_rain.jpeg',
        alertClass: 'news-alert-black',
        icon: 'fa-bullhorn',
        title: '黑色暴雨警告信號',
        defaultBody: '🚨 天文台發出黑色暴雨警告信號，香港廣泛地區已錄得超過70毫米雨量，山洪暴發風險極高。',
        animation: 'rain'
      },
      '紅雨': {
        warningImage: 'warning-red.png',
        heroImage: 'sora_bird_rain.jpeg',
        alertClass: 'news-alert-red',
        icon: 'fa-bullhorn',
        title: '紅色暴雨警告信號',
        defaultBody: '⚠️ 天文台發出紅色暴雨警告信號，香港廣泛地區已錄得超過50毫米雨量，請注意安全。',
        animation: 'rain'
      },
      '黃雨': {
        warningImage: 'warning-yellow.png',
        heroImage: 'sora_bird_rain.jpeg',
        alertClass: 'news-alert-yellow',
        icon: 'fa-bullhorn',
        title: '黃色暴雨警告信號',
        defaultBody: '⚠️ 天文台發出黃色暴雨警告信號，香港部分地區已錄得超過30毫米雨量。',
        animation: 'rain'
      },
      '8號風球': {
        warningImage: 'warning-typhoon_8.png',
        heroImage: 'sora_bird_typhoon.jpeg',
        alertClass: 'news-alert-typhoon-8',
        icon: 'fa-bullhorn',
        title: '八號烈風或暴風信號',
        defaultBody: '🌀 八號烈風或暴風信號現正生效，平均風速每小時63公里或以上，請勿外出。',
        animation: 'typhoon'
      },
      '9號風球': {
        warningImage: 'warning-typhoon_9.png',
        heroImage: 'sora_bird_typhoon.jpeg',
        alertClass: 'news-alert-typhoon-9',
        icon: 'fa-bullhorn',
        title: '九號烈風或暴風增強信號',
        defaultBody: '🌀 九號烈風或暴風增強信號現正生效，風力正在增強，請留在安全地方。',
        animation: 'typhoon'
      },
      '10號風球': {
        warningImage: 'warning-typhoon_10.png',
        heroImage: 'sora_bird_typhoon.jpeg',
        alertClass: 'news-alert-typhoon-10',
        icon: 'fa-bullhorn',
        title: '十號颶風信號',
        defaultBody: '🌀 十號颶風信號現正生效，風力達颶風程度，請遠離窗邊。',
        animation: 'typhoon'
      },
      '雷暴': {
        warningImage: 'warning-thunderstorm.png',
        heroImage: 'sora_bird_thunderstorm.jpeg',
        alertClass: 'news-alert-thunderstorm',
        icon: 'fa-bolt',
        title: '雷暴警告',
        defaultBody: '⚡ 雷暴警告現正生效，請留意閃電及局部地區性大雨。',
        animation: 'rain'
      },
      '酷熱': {
        warningImage: 'warning-hot.png',
        heroImage: 'sora_bird_hot.jpeg',
        alertClass: 'news-alert-hot',
        icon: 'fa-sun',
        title: '酷熱天氣警告',
        defaultBody: '☀️ 酷熱天氣警告現正生效，請避免長時間戶外活動，多補充水分。',
        animation: 'none'
      },
      '寒冷': {
        warningImage: 'warning-cold.png',
        heroImage: 'sora_bird_cold.jpeg',
        alertClass: 'news-alert-cold',
        icon: 'fa-snowflake',
        title: '寒冷天氣警告',
        defaultBody: '❄️ 寒冷天氣警告現正生效，請注意保暖。',
        animation: 'none'
      },
      '晴朗': {
        warningImage: 'warning-sunny.png',
        heroImage: 'sora_bird_normal.jpeg',
        alertClass: 'news-alert-none',
        icon: 'fa-check-circle',
        title: '天氣概況',
        defaultBody: '目前沒有惡劣天氣警告，天氣狀況良好。',
        animation: 'none'
      },
      '多雲': {
        warningImage: 'warning-cloudy.png',
        heroImage: 'sora_bird_cloudy.jpeg',
        alertClass: 'news-alert-none',
        icon: 'fa-check-circle',
        title: '天氣概況',
        defaultBody: '天氣多雲，部分地區有微雨。',
        animation: 'none'
      }
    };

    function updateWarningBadge(warningType, temp) {
      var config = WARNING_CONFIG[warningType];
      if (warningTemp) {
        warningTemp.innerHTML = Math.round(temp) + '<span class="temp-unit">°C</span>';
      }
      if (config && config.warningImage) {
        warningImage.src = config.warningImage;
        warningImage.style.display = 'block';
      } else {
        warningImage.style.display = 'none';
      }
    }

    function updateHeroImage(warningType) {
      var config = WARNING_CONFIG[warningType];
      if (config) {
        heroImageSrc.src = config.heroImage;
        heroImageSrc.alt = 'SORA 鳥兒天氣 - ' + warningType;
      } else {
        heroImageSrc.src = 'sora_bird_normal.jpeg';
        heroImageSrc.alt = 'SORA 鳥兒天氣';
      }
    }

    function updateAlertBox(warningType) {
      var config = WARNING_CONFIG[warningType];
      newsAlert.className = 'news-alert';
      if (!config) {
        newsAlert.classList.add('news-alert-hidden');
        return;
      }
      newsAlert.classList.add(config.alertClass);
      newsIcon.className = 'fas ' + config.icon;
      newsTitle.textContent = config.title;
    }

    // ===== 更新天氣數據畫面 =====
    function updateWeather(warningType, temp, humid, wind, uvVal, uvDescText, newsBodyText) {
      var config = WARNING_CONFIG[warningType];
      if (config) {
        updateAnimation(config.animation);
      } else {
        updateAnimation('none');
      }
      updateWarningBadge(warningType, temp);
      updateHeroImage(warningType);
      updateAlertBox(warningType);

      if (newsBodyText) {
        newsBody.textContent = newsBodyText;
      } else if (config) {
        newsBody.textContent = config.defaultBody;
      } else {
        newsBody.textContent = '目前沒有惡劣天氣警告，天氣狀況良好。';
      }

      var fullDate = formatFullDate();
      newsTime.textContent = '🕒 ' + fullDate;

      // 更新紫外線數據
      if (uvValueEl) uvValueEl.textContent = (uvVal !== undefined && uvVal !== null) ? uvVal : '--';
      if (uvDescEl) uvDescEl.textContent = uvDescText || '';

      humidity.textContent = Math.round(humid);
      windSpeed.textContent = Math.round(wind);
      updateTimestamp();
    }

    // 將 warnsum 嘅 code 轉成中文 key
    function mapWarningCode(code) {
      if (!code) return null;
      code = code.toUpperCase();
      if (code === 'WRAINB') return '黑雨';
      if (code === 'WRAINR') return '紅雨';
      if (code === 'WRAINA') return '黃雨';
      if (code === 'TC10') return '10號風球';
      if (code === 'TC9') return '9號風球';
      if (code.indexOf('TC8') === 0) return '8號風球';
      if (code === 'WTS') return '雷暴';
      if (code === 'WHOT') return '酷熱';
      if (code === 'WCOLD') return '寒冷';
      return null;
    }

    // ===== 1. 拎警告摘要 =====
    function fetchWarningSummary() {
      var url = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc';

      fetch(url)
        .then(function(response) {
          if (!response.ok) throw new Error('HTTP error: ' + response.status);
          return response.json();
        })
        .then(function(data) {
          var priority = ['黑雨', '紅雨', '黃雨', '10號風球', '9號風球', '8號風球', '雷暴', '酷熱', '寒冷'];
          var found = '晴朗';
          var foundList = [];

          for (var key in data) {
            if (data.hasOwnProperty(key) && data[key] && data[key].code) {
              var mapped = mapWarningCode(data[key].code);
              if (mapped) {
                foundList.push(mapped);
              }
            }
          }

          for (var j = 0; j < priority.length; j++) {
            if (foundList.indexOf(priority[j]) !== -1) {
              found = priority[j];
              break;
            }
          }

          currentWarning = found;
          console.log('✅ 警告摘要：', found, foundList, data);
          updateWeather(found, currentTemp, currentHumid, currentWind, currentUV, currentUVdesc);
        })
        .catch(function(error) {
          console.error('❌ 拎唔到警告摘要：', error);
          updateWeather('晴朗', currentTemp, currentHumid, currentWind, currentUV, currentUVdesc);
        });
    }

    // ===== 2. 拎天氣報告（溫度、濕度、風速、紫外線） =====
    function fetchWeatherReport() {
      var url = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc';

      fetch(url)
        .then(function(response) {
          if (!response.ok) throw new Error('HTTP error: ' + response.status);
          return response.json();
        })
        .then(function(data) {
          var temp = 0;
          var humid = 0;
          var wind = 0;
          var uvVal = '--';
          var uvDescText = '';

          // 擷取溫度
          if (data.temperature && data.temperature.data) {
            for (var i = 0; i < data.temperature.data.length; i++) {
              if (data.temperature.data[i].place === '香港天文台') {
                temp = data.temperature.data[i].value;
                break;
              }
            }
          }

          // 擷取紫外線數據
          if (data.uvindex && data.uvindex.data && data.uvindex.data.length > 0) {
            for (var u = 0; u < data.uvindex.data.length; u++) {
              var uvData = data.uvindex.data[u];
              if (uvData.place === '京士柏' || !uvData.place) {
                uvVal = uvData.value !== undefined ? uvData.value : '--';
                uvDescText = uvData.desc || '';
                break;
              }
            }
          } else {
            // 晚上或天文台未提供紫外線指數時
            uvVal = '0';
            uvDescText = '低';
          }

          // 擷取濕度
          if (data.humidity && data.humidity.data) {
            for (var j = 0; j < data.humidity.data.length; j++) {
              if (data.humidity.data[j].place === '香港天文台') {
                humid = data.humidity.data[j].value;
                break;
              }
            }
          }

          // 擷取風速（搜尋「啟德」或「香港天文台」）
          if (data.windSpeed && data.windSpeed.data) {
            for (var k = 0; k < data.windSpeed.data.length; k++) {
              if (data.windSpeed.data[k].place === '啟德' || data.windSpeed.data[k].place === '香港天文台') {
                wind = data.windSpeed.data[k].value;
                break;
              }
            }
          }

          currentTemp = temp;
          currentHumid = humid;
          currentWind = wind;
          currentUV = uvVal;
          currentUVdesc = uvDescText;

          console.log('✅ 天氣報告：溫度 ' + temp + '°C，濕度 ' + humid + '%，風速 ' + wind + ' km/h，紫外線指數 ' + uvVal + ' (' + uvDescText + ')');
          updateWeather(currentWarning, currentTemp, currentHumid, currentWind, currentUV, currentUVdesc);
        })
        .catch(function(error) {
          console.error('❌ 拎唔到天氣報告：', error);
          updateWeather(currentWarning, currentTemp, currentHumid, currentWind, currentUV, currentUVdesc);
        });
    }

    // ===== 3. 拎特別天氣提示 =====
    // ===== 3. 拎特別天氣提示（讀取全部提示） =====
        function fetchSpecialWeatherTips() {
          var url = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc';
    
          fetch(url)
            .then(function(response) {
              if (!response.ok) throw new Error('HTTP error: ' + response.status);
              return response.json();
            })
            .then(function(data) {
              var container = document.getElementById('specialTipContainer');
    
              if (data.swt && data.swt.length > 0) {
                var headerHtml = '<div class="tip-header" style="margin-bottom: 8px;"><span class="tip-label">📢 特別天氣提示</span></div>';
    
                var tipsListHtml = data.swt.map(function(item) {
                  var formattedTime = item.updateTime ? item.updateTime.replace('T', ' ').slice(0, 16) : '--:--';
                  return '<div class="tip-block">' +
                           '<div class="tip-body" style="line-height: 1.5;">' + item.desc + '</div>' +
                           '<div class="tip-time" style="font-size: 0.65rem; color: #8a9ba8; text-align: right; margin-top: 4px;">🕒 ' + formattedTime + '</div>' +
                         '</div>';
                }).join('<hr style="border: 0; border-top: 1px dashed rgba(122, 155, 181, 0.35); margin: 10px 0;">');
    
                container.innerHTML = headerHtml + tipsListHtml;
                console.log('✅ 特別天氣提示已更新，共 ' + data.swt.length + ' 條');
              } else {
                container.innerHTML = 
                  '<div class="tip-header">' +
                    '<span class="tip-label">📢 特別天氣提示</span>' +
                    '<span class="tip-time" style="font-size: 0.65rem; color: #8a9ba8;"> </span>' +
                  '</div>' +
                  '<div class="tip-body" style="margin-top: 4px;">目前沒有特別天氣提示</div>';
              }
            })
            .catch(function(error) {
              console.error('❌ 拎唔到特別天氣提示：', error);
              var container = document.getElementById('specialTipContainer');
              container.innerHTML = 
                '<div class="tip-header">' +
                  '<span class="tip-label">📢 特別天氣提示</span>' +
                  '<span class="tip-time" style="font-size: 0.65rem; color: #8a9ba8;"> </span>' +
                '</div>' +
                '<div class="tip-body" style="margin-top: 4px;">⚠️ 無法載入天氣提示</div>';
            });
        }

    // ===== 4. 全部更新 =====
    function refreshAllData() {
      fetchWeatherReport();
      setTimeout(function() {
        fetchWarningSummary();
      }, 200);
      setTimeout(function() {
        fetchSpecialWeatherTips();
      }, 400);
    }

    // ===== 初始化 =====
    createRain();
    createWindLines();
    window.addEventListener('load', function() {
      refreshAllData();
      setInterval(refreshAllData, 300000); // 每 5 分鐘更新一次
      console.log('🌧️ SORA HK Production 版已啟動（直接 API）');
      console.log('📡 數據來源：香港天文台 Open Data API');
    });
    window.refreshSORA = refreshAllData;
  })();
</script>
