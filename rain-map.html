<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時降雨分佈 · SORA HK</title>
    <style>
        :root {
            --bg-canvas: #f1f5f9;
            --bg-card: #ffffff;
            --border-card: rgba(226, 232, 240, 0.8);
            --text-main: #334155;
            --text-sub: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-canvas);
            color: var(--text-main);
            padding: 16px;
        }

        .modal-container {
            max-width: 420px;
            margin: 0 auto;
            background: var(--bg-canvas);
            border-radius: 24px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-box {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 16px;
            border: 1px solid var(--border-card);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        /* 1. 當前雨勢概況 */
        .status-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-info h3 {
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            background: #e2e8f0;
            color: #475569;
            font-weight: 500;
        }

        .status-badge.safe {
            background: #dcfce7;
            color: #15803d;
        }

        .status-badge.warning {
            background: #ffedd5;
            color: #c2410c;
        }

        .status-sub {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* 2. 圖例欄 */
        .legend-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 0.7rem;
            color: var(--text-sub);
        }

        .legend-pill {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; }

        /* 地圖區域 */
        .map-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .svg-container {
            width: 100%;
            height: auto;
            background: #f8fafc;
            border-radius: 16px;
            padding: 12px;
        }

        .district-poly {
            fill: #e2e8f0;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linejoin: round;
            transition: fill 0.3s ease;
        }

        .district-label {
            font-size: 11px;
            fill: #64748b;
            font-weight: 600;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }

        .time-label {
            font-size: 0.7rem;
            color: var(--text-sub);
            margin-top: 10px;
            text-align: center;
        }

        /* 3. 各區雨量排行榜 */
        .section-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .district-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .district-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .district-name {
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rank-tag {
            font-size: 0.65rem;
            padding: 1px 6px;
            border-radius: 6px;
            background: #e2e8f0;
            color: var(--text-sub);
        }

        .district-val {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <div class="modal-container">
        <!-- 1. 當前雨勢概況卡片 -->
        <div class="card-box status-card">
            <div class="status-info">
                <h3>即時雨勢 <span class="status-badge safe" id="statusBadge">更新中...</span></h3>
                <div class="status-sub" id="statusSub">正在讀取天文台數據...</div>
            </div>
            <div style="text-align: right;">
                <div style="font-size: 1.1rem; font-weight: 700; color: var(--accent-blue);" id="maxVal">0 <span style="font-size:0.7rem;">mm</span></div>
                <div style="font-size: 0.65rem; color: var(--text-sub);">最高雨量</div>
            </div>
        </div>

        <!-- 2. 地圖主卡片 -->
        <div class="card-box map-card">
            <div class="legend-row" style="margin-bottom: 12px;">
                <div class="legend-pill"><div class="dot" style="background:#e2e8f0;"></div>無</div>
                <div class="legend-pill"><div class="dot" style="background:#fde047;"></div>輕度</div>
                <div class="legend-pill"><div class="dot" style="background:#fb923c;"></div>中度</div>
                <div class="legend-pill"><div class="dot" style="background:#ef4444;"></div>重度</div>
                <div class="legend-pill"><div class="dot" style="background:#a855f7;"></div>極度</div>
            </div>

            <div class="svg-container">
                <svg viewBox="0 0 400 320" width="100%" height="100%">
                    <polygon id="poly-屯門區" class="district-poly" points="40,110 80,100 110,130 80,160 40,140" />
                    <text x="70" y="128" class="district-label">屯門</text>

                    <polygon id="poly-元朗區" class="district-poly" points="70,50 140,40 150,90 90,100" />
                    <text x="110" y="70" class="district-label">元朗</text>

                    <polygon id="poly-北區" class="district-poly" points="180,20 260,20 250,70 170,60" />
                    <text x="215" y="45" class="district-label">北區</text>

                    <polygon id="poly-大埔區" class="district-poly" points="240,60 300,60 280,110 210,90" />
                    <text x="255" y="80" class="district-label">大埔</text>

                    <polygon id="poly-荃灣區" class="district-poly" points="110,110 160,100 170,130 120,140" />
                    <text x="140" y="120" class="district-label">荃灣</text>

                    <polygon id="poly-葵青區" class="district-poly" points="130,145 170,135 180,160 140,165" />
                    <text x="155" y="150" class="district-label">葵青</text>

                    <polygon id="poly-沙田區" class="district-poly" points="180,95 240,90 240,135 180,130" />
                    <text x="210" y="112" class="district-label">沙田</text>

                    <polygon id="poly-西貢區" class="district-poly" points="280,100 350,110 320,170 260,140" />
                    <text x="300" y="135" class="district-label">西貢</text>

                    <polygon id="poly-深水埗區" class="district-poly" points="135,170 170,165 175,185 140,190" />
                    <text x="155" y="178" class="district-label">深水埗</text>

                    <polygon id="poly-九龍城區" class="district-poly" points="195,165 225,165 220,190 190,190" />
                    <text x="208" y="178" class="district-label">九龍城</text>

                    <polygon id="poly-黃大仙區" class="district-poly" points="210,140 250,140 245,160 205,160" />
                    <text x="228" y="150" class="district-label">黃大仙</text>

                    <polygon id="poly-觀塘區" class="district-poly" points="250,165 285,165 280,190 245,190" />
                    <text x="265" y="178" class="district-label">觀塘</text>

                    <polygon id="poly-將軍澳" class="district-poly" points="285,165 330,170 320,195 280,190" />
                    <text x="302" y="180" class="district-label">將軍澳</text>

                    <polygon id="poly-油尖旺區" class="district-poly" points="160,195 195,195 190,215 155,215" />
                    <text x="175" y="205" class="district-label">油尖旺</text>

                    <polygon id="poly-中西區" class="district-poly" points="130,230 180,225 185,255 135,260" />
                    <text x="158" y="242" class="district-label">中西區</text>

                    <polygon id="poly-灣仔區" class="district-poly" points="190,230 220,230 220,255 190,255" />
                    <text x="205" y="242" class="district-label">灣仔</text>

                    <polygon id="poly-東區" class="district-poly" points="225,225 275,225 265,260 225,255" />
                    <text x="248" y="242" class="district-label">東區</text>

                    <polygon id="poly-南區" class="district-poly" points="140,265 220,260 210,295 150,295" />
                    <text x="180" y="278" class="district-label">南區</text>

                    <polygon id="poly-離島區" class="district-poly" points="20,200 110,210 100,280 20,260" />
                    <text x="65" y="240" class="district-label">離島</text>
                </svg>
            </div>

            <div class="time-label" id="mapTimeLabel">— 過去一小時數據 (-- 更新) —</div>
        </div>

        <!-- 3. 各區雨量排行榜卡片 -->
        <div class="card-box">
            <div class="section-title">
                <span>📍 各區雨量排行榜</span>
                <span class="status-badge">即時數據</span>
            </div>
            
            <div class="district-list" id="districtList"></div>
        </div>
    </div>

    <script>
        const stationToDistrict = {
            "HKA": "離島區", "CCH": "離島區", "LCK": "葵青區", "NKB": "北區",
            "SHA": "沙田區", "SKG": "西貢區", "TAP": "大埔區", "TW": "荃灣區",
            "TUN": "屯門區", "YL": "元朗區", "KCT": "九龍城區", "KTG": "觀塘區",
            "SSP": "深水埗區", "WTS": "黃大仙區", "YMT": "油尖旺區", "HKO": "中西區",
            "AE1": "東區", "HKS": "南區", "WCH": "灣仔區"
        };

        const districtData = {
            '離島區': 0, '葵青區': 0, '北區': 0, '沙田區': 0, '西貢區': 0, 
            '大埔區': 0, '荃灣區': 0, '屯門區': 0, '元朗區': 0, '九龍城區': 0, 
            '觀塘區': 0, '深水埗區': 0, '黃大仙區': 0, '油尖旺區': 0, '中西區': 0, 
            '東區': 0, '南區': 0, '灣仔區': 0, '將軍澳': 0
        };

        function getColor(rain) {
            if (!rain || rain <= 0) return '#e2e8f0';
            if (rain < 10) return '#fde047';
            if (rain < 20) return '#fb923c';
            if (rain < 40) return '#ef4444';
            return '#a855f7';
        }

        function updateUI(timeStr) {
            let max = 0;
            let maxName = '';

            for (const name in districtData) {
                const val = districtData[name];
                if (val > max) {
                    max = val;
                    maxName = name;
                }
                const poly = document.getElementById(`poly-${name}`);
                if (poly) poly.style.fill = getColor(val);
            }

            document.getElementById('maxVal').innerHTML = `${max} <span style="font-size:0.7rem;">mm</span>`;
            
            const statusBadgeEl = document.getElementById('statusBadge');
            const statusSubEl = document.getElementById('statusSub');

            if (max > 0) {
                statusBadgeEl.textContent = '有降雨';
                statusBadgeEl.className = 'status-badge warning';
                statusSubEl.textContent = `最高雨量地區：${maxName}`;
            } else {
                statusBadgeEl.textContent = '全港乾爽';
                statusBadgeEl.className = 'status-badge safe';
                statusSubEl.textContent = '現時各區均無顯著降雨';
            }

            document.getElementById('mapTimeLabel').textContent = `— 過去一小時數據 (${timeStr} 更新) —`;

            const sortedDistricts = Object.entries(districtData)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 3);

            document.getElementById('districtList').innerHTML = sortedDistricts.map(([name, val], index) => `
                <div class="district-item">
                    <div class="district-name">
                        <span class="rank-tag">${index + 1}</span> ${name}
                    </div>
                    <div class="district-val">${val} mm</div>
                </div>
            `).join('');
        }

        async function fetchRealRainfall() {
            try {
                const response = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/hourlyRainfall.php?lang=tc');
                if (!response.ok) throw new Error('API Error');

                const data = await response.json();
                for (const key in districtData) districtData[key] = 0;

                if (data.hourlyRainfall) {
                    data.hourlyRainfall.forEach(station => {
                        const district = stationToDistrict[station.automaticWeatherStation];
                        if (district) {
                            let val = parseFloat(station.value);
                            if (isNaN(val) || station.value === 'M') val = 0;
                            if (val > districtData[district]) {
                                districtData[district] = Math.round(val * 10) / 10;
                            }
                        }
                    });
                }

                const dataTime = data.obsTime ? data.obsTime.slice(11, 16) : '--:--';
                updateUI(dataTime);

            } catch (error) {
                updateUI('--:--');
            }
        }

        fetchRealRainfall();
    </script>
</body>
</html>
