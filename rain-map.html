<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時降雨分佈 · SORA HK</title>
    <style>
        :root {
            --bg-canvas: #f1f5f9;
            --bg-card: #ffffff;
            --border-card: rgba(226, 232, 240, 0.8);
            --text-main: #334155;
            --text-sub: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-canvas);
            color: var(--text-main);
            padding: 16px;
        }

        /* 彈窗主體容器 */
        .modal-container {
            max-width: 420px;
            margin: 0 auto;
            background: var(--bg-canvas);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 頂部 Header */
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
        }

        .modal-title {
            font-size: 1.05rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-sub);
            cursor: pointer;
        }

        /* 風暴風格通用白底卡片 */
        .card-box {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 16px;
            border: 1px solid var(--border-card);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        /* 1. 當前雨勢概況卡片 */
        .status-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-info h3 {
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            background: #e2e8f0;
            color: #475569;
            font-weight: 500;
        }

        .status-badge.safe {
            background: #dcfce7;
            color: #15803d;
        }

        .status-badge.warning {
            background: #ffedd5;
            color: #c2410c;
        }

        .status-sub {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* 2. 圖例欄 (Pill 樣式) */
        .legend-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 0.7rem;
            color: var(--text-sub);
        }

        .legend-pill {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; }

        /* 3. 地圖區域卡片 */
        .map-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .map-placeholder {
            width: 100%;
            height: 200px;
            background: #f8fafc;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            font-size: 0.85rem;
            border: 1px dashed var(--border-card);
        }

        .time-label {
            font-size: 0.7rem;
            color: var(--text-sub);
            margin-top: 10px;
            text-align: center;
        }

        /* 4. 各區雨量排行榜 (參照風暴歷史紀錄風格) */
        .section-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .district-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .district-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .district-name {
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rank-tag {
            font-size: 0.65rem;
            padding: 1px 6px;
            border-radius: 6px;
            background: #e2e8f0;
            color: var(--text-sub);
        }

        .district-val {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <div class="modal-container">
        <!-- Header -->
        <div class="modal-header">
            <div class="modal-title">🌧️ 即時降雨分佈</div>
            <button class="close-btn">✕</button>
        </div>

        <!-- 1. 當前雨勢概況卡片 -->
        <div class="card-box status-card">
            <div class="status-info">
                <h3>即時雨勢 <span class="status-badge safe" id="statusBadge">更新中...</span></h3>
                <div class="status-sub" id="statusSub">正在讀取天文台數據...</div>
            </div>
            <div style="text-align: right;">
                <div style="font-size: 1.1rem; font-weight: 700; color: var(--accent-blue);" id="maxVal">0 <span style="font-size:0.7rem;">mm</span></div>
                <div style="font-size: 0.65rem; color: var(--text-sub);">最高雨量</div>
            </div>
        </div>

        <!-- 2. 地圖主卡片 -->
        <div class="card-box map-card">
            <!-- 圖例 (已修正極度) -->
            <div class="legend-row" style="margin-bottom: 12px;">
                <div class="legend-pill"><div class="dot" style="background:#cbd5e1;"></div>無</div>
                <div class="legend-pill"><div class="dot" style="background:#fde047;"></div>輕度</div>
                <div class="legend-pill"><div class="dot" style="background:#fb923c;"></div>中度</div>
                <div class="legend-pill"><div class="dot" style="background:#ef4444;"></div>重度</div>
                <div class="legend-pill"><div class="dot" style="background:#a855f7;"></div>極度</div>
            </div>

            <!-- 你的 SVG 雨量地圖填入這裡 -->
            <div class="map-placeholder" id="mapArea">
                [ 雨量 SVG 地圖 ]
            </div>

            <div class="time-label" id="mapTimeLabel">— 過去一小時數據 (-- 更新) —</div>
        </div>

        <!-- 3. 雨量重點區域卡片 (風暴歷史列表風格) -->
        <div class="card-box">
            <div class="section-title">
                <span>📍 各區雨量排行榜</span>
                <span class="status-badge">即時數據</span>
            </div>
            
            <div class="district-list" id="districtList">
                <!-- 由 JS 動態生成列表 -->
            </div>
        </div>
    </div>

    <script>
        // 氣象站與地區對應表
        const stationToDistrict = {
            "HKA": "離島區", "CCH": "離島區", "LCK": "葵青區", "NKB": "北區",
            "SHA": "沙田區", "SKG": "西貢區", "TAP": "大埔區", "TW": "荃灣區",
            "TUN": "屯門區", "YL": "元朗區", "KCT": "九龍城區", "KTG": "觀塘區",
            "SSP": "深水埗區", "WTS": "黃大仙區", "YMT": "油尖旺區", "HKO": "中西區",
            "AE1": "東區", "HKS": "南區", "WCH": "灣仔區"
        };

        const districtData = {
            '離島區': 0, '葵青區': 0, '北區': 0, '沙田區': 0, '西貢區': 0, 
            '大埔區': 0, '荃灣區': 0, '屯門區': 0, '元朗區': 0, '九龍城區': 0, 
            '觀塘區': 0, '深水埗區': 0, '黃大仙區': 0, '油尖旺區': 0, '中西區': 0, 
            '東區': 0, '南區': 0, '灣仔區': 0
        };

        // 更新 UI 畫面
        function updateUI(timeStr) {
            let max = -1;
            let maxName = '';

            // 1. 計算最高雨量
            for (const name in districtData) {
                const val = districtData[name];
                if (val > max) {
                    max = val;
                    maxName = name;
                }
            }

            // 2. 更新頂部狀態卡片
            const maxValEl = document.getElementById('maxVal');
            const statusBadgeEl = document.getElementById('statusBadge');
            const statusSubEl = document.getElementById('statusSub');

            maxValEl.innerHTML = `${max >= 0 ? max : 0} <span style="font-size:0.7rem;">mm</span>`;
            
            if (max > 0) {
                statusBadgeEl.textContent = '有降雨';
                statusBadgeEl.className = 'status-badge warning';
                statusSubEl.textContent = `最高雨量地區：${maxName}`;
            } else {
                statusBadgeEl.textContent = '全港乾爽';
                statusBadgeEl.className = 'status-badge safe';
                statusSubEl.textContent = '現時各區均無顯著降雨';
            }

            // 3. 更新時間標籤
            document.getElementById('mapTimeLabel').textContent = `— 過去一小時數據 (${timeStr} 更新) —`;

            // 4. 動態生成各區雨量 Top 3 列表
            const sortedDistricts = Object.entries(districtData)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 3);

            const districtListEl = document.getElementById('districtList');
            districtListEl.innerHTML = sortedDistricts.map(([name, val], index) => `
                <div class="district-item">
                    <div class="district-name">
                        <span class="rank-tag">${index + 1}</span> ${name}
                    </div>
                    <div class="district-val">${val} mm</div>
                </div>
            `).join('');
        }

        // 抓取天文台即時雨量 API
        async function fetchRealRainfall() {
            try {
                const response = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/hourlyRainfall.php?lang=tc');
                if (!response.ok) throw new Error('API Error');

                const data = await response.json();
                for (const key in districtData) districtData[key] = 0;

                if (data.hourlyRainfall) {
                    data.hourlyRainfall.forEach(station => {
                        const district = stationToDistrict[station.automaticWeatherStation];
                        if (district) {
                            let val = parseFloat(station.value);
                            if (isNaN(val) || station.value === 'M') val = 0;
                            if (val > districtData[district]) {
                                districtData[district] = Math.round(val * 10) / 10;
                            }
                        }
                    });
                }

                // 簡單用 slice(11, 16) 截取 15:45 時間字串並更新 UI
                const dataTime = data.obsTime ? data.obsTime.slice(11, 16) : '';
                updateUI(dataTime);

            } catch (error) {
                console.error("抓取失敗，使用預設值", error);
                updateUI('--:--');
            }
        }

        // 初始化載入
        fetchRealRainfall();
    </script>
</body>
</html>
