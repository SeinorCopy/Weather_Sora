<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風暴紀錄 · SORA HK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-card: #eef2f6;
            --border-card: rgba(180, 195, 210, 0.12);
            --text-main: #3d525c;
            --text-sub: #8a9ba8;
            --accent-red: #f87171;
            --accent-orange: #fb923c;
            --accent-blue: #60a5fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #e8edf2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .storm-container {
            max-width: 480px;
            width: 100%;
            background: #f5f7fa;
            border-radius: 32px;
            padding: 28px 24px 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(180, 195, 210, 0.2);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ===== 風暴動畫 ===== */
        .storm-animation {
            position: relative;
            width: 100%;
            height: 60px;
            margin-bottom: -10px;
            opacity: 0.5;
            pointer-events: none;
            overflow: hidden;
        }

        .storm-animation svg {
            width: 100%;
            height: 100%;
        }

        .spiral-ring {
            animation: spin 12s linear infinite;
            transform-origin: center;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .bird {
            animation: blowBird 3s ease-in-out infinite;
        }

        @keyframes blowBird {
            0% { transform: translate(0px, 0px) rotate(0deg); opacity: 1; }
            25% { transform: translate(15px, -12px) rotate(-10deg); opacity: 1; }
            50% { transform: translate(30px, -20px) rotate(-20deg); opacity: 0.8; }
            75% { transform: translate(45px, -25px) rotate(-30deg); opacity: 0.5; }
            100% { transform: translate(60px, -30px) rotate(-40deg); opacity: 0; }
        }

        .wind-line {
            animation: windSweep 2.5s ease-in-out infinite;
        }
        .wind-line:nth-child(2) { animation-delay: 0.8s; }
        .wind-line:nth-child(3) { animation-delay: 1.6s; }

        @keyframes windSweep {
            0% { transform: translateX(-20px) scaleX(0.3); opacity: 0; }
            30% { opacity: 0.6; }
            70% { opacity: 0.6; }
            100% { transform: translateX(40px) scaleX(1.2); opacity: 0; }
        }

        /* ===== Header ===== */
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(180, 195, 210, 0.15);
        }

        .back-btn {
            background: #eef2f6;
            border: 1px solid rgba(180, 195, 210, 0.15);
            color: #3d525c;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s ease;
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .back-btn:hover { background: #dce3ea; transform: scale(0.95); }

        .header h2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #3d525c;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h2 i { color: #7a9bb5; }

        /* ===== 風暴資訊卡片（合併版） ===== */
        .storm-info-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            padding: 14px 16px;
        }

        .storm-info-card .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .storm-info-card .status-label {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .storm-info-card .status-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .storm-info-card .status-value.no-storm {
            color: var(--text-sub);
            font-weight: 400;
        }

        .storm-info-card .divider {
            border: none;
            border-top: 1px solid rgba(180, 195, 210, 0.12);
            margin: 8px 0;
        }

        .storm-info-card .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .storm-info-card .bottom-row .left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .storm-info-card .bottom-row .left .sub {
            font-size: 0.7rem;
            color: var(--text-sub);
        }

        .storm-info-card .bottom-row .right {
            text-align: right;
        }

        .storm-info-card .bottom-row .right .val {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-red);
        }

        .storm-info-card .bottom-row .right .lbl {
            font-size: 0.65rem;
            color: var(--text-sub);
        }

        /* ===== 歷史卡片 ===== */
        .history-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            padding: 14px 16px;
        }

        .history-title {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 10px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .history-title i { color: #7a9bb5; }

        .history-item {
            background: #e8edf2;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 6px;
            transition: all 0.2s ease;
        }
        .history-item:last-child { margin-bottom: 0; }
        .history-item:hover { background: #dce3ea; }

        .history-item .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }
        .history-item .storm-name { font-weight: 500; font-size: 0.9rem; }
        .history-item .detail-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.7rem;
            color: var(--text-sub);
            margin-top: 3px;
        }
        .history-item .detail-row i { width: 14px; font-size: 0.65rem; color: #7a9bb5; }

        .signal-tag {
            display: inline-block;
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 500;
            color: #fff;
            flex-shrink: 0;
        }
        .signal-8 { background: #f39c12; }
        .signal-9 { background: #e67e22; }
        .signal-10 { background: #c0392b; }

        .year-group .year-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-main);
            padding: 6px 0 4px 4px;
            border-bottom: 1px solid rgba(122, 155, 181, 0.15);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .year-group .year-title .count {
            font-weight: 400;
            color: var(--text-sub);
            margin-left: auto;
            font-size: 0.7rem;
        }

        /* ===== 加載狀態 ===== */
        #loading {
            text-align: center;
            padding: 20px 0;
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        /* ===== 時間標籤 ===== */
        .time-label {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-sub);
        }

        /* ===== 空狀態 ===== */
        .empty-state {
            text-align: center;
            padding: 20px 0;
            color: var(--text-sub);
        }
        .empty-state i { font-size: 2rem; color: #d0d8e0; margin-bottom: 8px; display: block; }

        /* ===== 響應式 ===== */
        @media (max-width: 450px) {
            .storm-container { padding: 18px 14px 22px; }
            .header h2 { font-size: 1rem; }
            .history-item { padding: 8px 12px; }
            .storm-info-card .bottom-row { flex-direction: column; align-items: flex-start; gap: 6px; }
            .storm-info-card .bottom-row .right { text-align: left; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="storm-container">

        <!-- ===== 🌀 風暴動畫 ===== -->
        <div class="storm-animation">
            <svg viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg">
                <g class="spiral-ring">
                    <circle cx="50" cy="20" r="14" fill="none" stroke="#7a9bb5" stroke-width="1.5" opacity="0.15"/>
                    <circle cx="50" cy="20" r="10" fill="none" stroke="#7a9bb5" stroke-width="1.2" opacity="0.2"/>
                    <circle cx="50" cy="20" r="6" fill="none" stroke="#7a9bb5" stroke-width="0.8" opacity="0.25"/>
                </g>
                <line class="wind-line" x1="10" y1="14" x2="28" y2="14" stroke="#7a9bb5" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
                <line class="wind-line" x1="10" y1="20" x2="25" y2="20" stroke="#7a9bb5" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
                <line class="wind-line" x1="10" y1="26" x2="28" y2="26" stroke="#7a9bb5" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
                <g class="bird" transform="translate(10, 18)">
                    <ellipse cx="6" cy="4" rx="5" ry="3" fill="#7a9bb5" opacity="0.7"/>
                    <circle cx="11" cy="3" r="2.5" fill="#7a9bb5" opacity="0.7"/>
                    <circle cx="12" cy="2.5" r="0.8" fill="#3d525c"/>
                    <path d="M6,2 L2,-4 L5,-1 Z" fill="#8a9ba8" opacity="0.6"/>
                    <path d="M8,2 L4,-5 L7,-2 Z" fill="#8a9ba8" opacity="0.6"/>
                    <path d="M1,4 L-3,2 L-1,5 Z" fill="#8a9ba8" opacity="0.5"/>
                </g>
            </svg>
        </div>

        <!-- ===== Header ===== -->
        <div class="header">
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h2>
                <i class="fas fa-skull"></i> 風 暴 檔 案
            </h2>
        </div>

        <!-- ============================================================ -->
        <!-- 第一部分：風暴資訊（即時） -->
        <!-- ============================================================ -->
        <div class="storm-info-card" id="stormInfoCard">
            <div class="status-row">
                <span class="status-label">🌤️ 現時無熱帶氣旋</span>
                <span class="status-value no-storm" id="stormStatus">安全</span>
            </div>
            <hr class="divider">
            <div class="bottom-row">
                <div class="left">
                    <span class="sub" id="stormLocation">香港 800 公里範圍內無風暴</span>
                    <span class="sub" id="stormMovement" style="display:none;">移動：--</span>
                </div>
                <div class="right">
                    <div class="val" id="stormWind">0</div>
                    <div class="lbl">中心最高風力 (km/h)</div>
                </div>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- 第二部分：風暴檔案（歷史紀錄） -->
        <!-- ============================================================ -->
        <div class="history-card">
            <div class="history-title">
                <i class="fas fa-archive"></i> 歷 史 紀 錄
            </div>
            <div id="historyList">
                <div id="loading"><i class="fas fa-spinner fa-pulse"></i> 載入中...</div>
            </div>
        </div>

        <div class="time-label" id="updateTimeLabel">—  (--:--) —</div>
    </div>

    <script>
        (function() {
            // ============================================================
            // 第一部分：風暴檔案（歷史）
            // ============================================================
            const historyList = document.getElementById('historyList');
            const loadingEl = document.getElementById('loading');

            async function loadHistory() {
                const url = 'https://cdn.jsdelivr.net/gh/SeinorCopy/Weather_Sora@main/hk_typhoon_history.json';

                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('HTTP error: ' + response.status);
                    const data = await response.json();

                    if (!data || data.length === 0) {
                        loadingEl.innerHTML = `<div class="empty-state"><i class="fas fa-cloud"></i> 暫時沒有風暴記錄</div>`;
                        return;
                    }

                    const groups = {};
                    data.forEach(item => {
                        const year = item.year;
                        if (!groups[year]) groups[year] = [];
                        groups[year].push(item);
                    });

                    const sortedYears = Object.keys(groups).sort((a, b) => b - a);

                    let html = '';
                    sortedYears.forEach(year => {
                        const items = groups[year];
                        items.sort((a, b) => b.highest_signal - a.highest_signal);

                        let itemsHtml = '';
                        items.forEach(item => {
                            let signalClass = '';
                            if (item.highest_signal >= 10) signalClass = 'signal-10';
                            else if (item.highest_signal >= 9) signalClass = 'signal-9';
                            else if (item.highest_signal >= 8) signalClass = 'signal-8';

                            itemsHtml += `
                                <div class="history-item">
                                    <div class="top-row">
                                        <span class="storm-name">${item.name}</span>
                                        <span class="signal-tag ${signalClass}">${item.highest_signal}號</span>
                                    </div>
                                    <div class="detail-row">
                                        <span><i class="fas fa-flag-checkered"></i> ${item.hoisted_time}</span>
                                        <span><i class="fas fa-flag"></i> ${item.lowered_time}</span>
                                        <span><i class="fas fa-clock"></i> ${item.duration}</span>
                                    </div>
                                </div>
                            `;
                        });

                        html += `
                            <div class="year-group">
                                <div class="year-title">
                                    <i class="fas fa-calendar-alt"></i> ${year}
                                    <span class="count">${items.length} 個</span>
                                </div>
                                ${itemsHtml}
                            </div>
                        `;
                    });

                    historyList.innerHTML = html;
                    loadingEl.style.display = 'none';

                } catch (error) {
                    console.error('載入風暴檔案失敗：', error);
                    loadingEl.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            無法載入風暴檔案<br>
                            <span style="font-size:0.75rem; color:#8a9ba8;">請檢查網絡連線</span>
                        </div>
                    `;
                }
            }

            // ============================================================
            // 第二部分：即時風暴數據
            // ============================================================
            const stormStatusEl = document.getElementById('stormStatus');
            const stormLocationEl = document.getElementById('stormLocation');
            const stormMovementEl = document.getElementById('stormMovement');
            const stormWindEl = document.getElementById('stormWind');
            const stormInfoCard = document.getElementById('stormInfoCard');
            const updateTimeLabel = document.getElementById('updateTimeLabel');

            function getWindCategory(wind) {
                if (wind < 63) return '🌀 熱帶低氣壓';
                if (wind < 88) return '🌀 熱帶風暴';
                if (wind < 118) return '💨 強烈熱帶風暴';
                if (wind < 150) return '💨 颱 風';
                if (wind < 185) return '🌪️強 颱 風';
                return '🌪️ 超 強 颱 風 ';
            }

            function renderNoStorm(timeStr) {
                // 改為顯示「現時無熱帶氣旋」嘅樣式
                stormStatusEl.textContent = ' - -';
                stormStatusEl.className = 'status-value no-storm';
                stormLocationEl.textContent = '香港 800 公里範圍內無風暴';
                stormMovementEl.style.display = 'none';
                stormWindEl.textContent = '0';
                document.querySelector('.right').style.display = 'none';
                updateTimeLabel.textContent = `— ${timeStr} —`;
            }

            function renderStormInfo(tc, timeStr) {
                const wind = parseInt(tc.maxWind) || 0;
                const category = getWindCategory(wind);
                const lat = tc.latitude || '--';
                const lon = tc.longitude || '--';

                // 更新狀態
                stormStatusEl.textContent = category;
                stormStatusEl.className = 'status-value';
                stormLocationEl.textContent = `位置：北緯 ${lat}° / 東經 ${lon}°`;

                // 顯示移動方向
                if (tc.movement) {
                    stormMovementEl.style.display = 'block';
                    stormMovementEl.textContent = `移動：${tc.movement.direction} (${tc.movement.speed} km/h)`;
                } else {
                    stormMovementEl.style.display = 'none';
                }

                stormWindEl.textContent = wind;
                document.querySelector('.right').style.display = 'flex';
                updateTimeLabel.textContent = `—  ${timeStr} —`;
            }

            async function fetchStormData() {
                try {
                    const response = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=tcInfo&lang=tc');
                    if (!response.ok) throw new Error('API Error');
                    const data = await response.json();

                    const updateTime = data.updateTime ? data.updateTime.slice(11, 16) : new Date().toTimeString().slice(0, 5);

                    if (data.tropicalCyclone && data.tropicalCyclone.length > 0) {
                        const tc = data.tropicalCyclone[0];
                        renderStormInfo(tc, updateTime);
                    } else {
                        renderNoStorm(updateTime);
                    }
                } catch (error) {
                    console.error('API 錯誤:', error);
                    renderNoStorm(new Date().toTimeString().slice(0, 5));
                }
            }

            // ============================================================
            // 啟動
            // ============================================================
            loadHistory();
            fetchStormData();
            setInterval(fetchStormData, 300000);
        })();
    </script>
</body>
</html>
