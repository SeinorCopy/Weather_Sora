<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風暴紀錄 · SORA HK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-card: #eef2f6;
            --border-card: rgba(180, 195, 210, 0.12);
            --text-main: #3d525c;
            --text-sub: #8a9ba8;
            --accent-red: #f87171;
            --accent-orange: #fb923c;
            --accent-blue: #60a5fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #e8edf2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .storm-container {
            max-width: 480px;
            width: 100%;
            background: #f5f7fa;
            border-radius: 32px;
            padding: 28px 24px 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(180, 195, 210, 0.2);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ===== 風暴動畫 ===== */
        .storm-animation {
            position: relative;
            width: 100%;
            height: 60px;
            margin-bottom: -10px;
            opacity: 0.5;
            pointer-events: none;
            overflow: hidden;
        }

        .storm-animation svg {
            width: 100%;
            height: 100%;
        }

        .spiral-ring {
            animation: spin 12s linear infinite;
            transform-origin: center;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .bird {
            animation: blowBird 3s ease-in-out infinite;
        }

        @keyframes blowBird {
            0% { transform: translate(0px, 0px) rotate(0deg); opacity: 1; }
            25% { transform: translate(15px, -12px) rotate(-10deg); opacity: 1; }
            50% { transform: translate(30px, -20px) rotate(-20deg); opacity: 0.8; }
            75% { transform: translate(45px, -25px) rotate(-30deg); opacity: 0.5; }
            100% { transform: translate(60px, -30px) rotate(-40deg); opacity: 0; }
        }

        .wind-line {
            animation: windSweep 2.5s ease-in-out infinite;
        }
        .wind-line:nth-child(2) { animation-delay: 0.8s; }
        .wind-line:nth-child(3) { animation-delay: 1.6s; }

        @keyframes windSweep {
            0% { transform: translateX(-20px) scaleX(0.3); opacity: 0; }
            30% { opacity: 0.6; }
            70% { opacity: 0.6; }
            100% { transform: translateX(40px) scaleX(1.2); opacity: 0; }
        }

        /* ===== Header - 隱藏 ===== */
        .header {
            display: none !important;
        }

        /* ===== 風暴資訊卡片（合併版） ===== */
        .storm-info-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            padding: 14px 16px;
        }

        .storm-info-card .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .storm-info-card .status-label {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .storm-info-card .status-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .storm-info-card .status-value.no-storm {
            color: var(--text-sub);
            font-weight: 400;
        }

        .storm-info-card .divider {
            border: none;
            border-top: 1px solid rgba(180, 195, 210, 0.12);
            margin: 8px 0;
        }

        .storm-info-card .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .storm-info-card .bottom-row .left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .storm-info-card .bottom-row .left .sub {
            font-size: 0.7rem;
            color: var(--text-sub);
        }

        .storm-info-card .bottom-row .right {
            text-align: right;
        }

        .storm-info-card .bottom-row .right .val {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-red);
        }

        .storm-info-card .bottom-row .right .lbl {
            font-size: 0.65rem;
            color: var(--text-sub);
        }

        /* ===== 歷史卡片 - 重新設計 ===== */
        .history-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            padding: 16px 16px 12px;
        }

        .history-title {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        .history-title i { color: #7a9bb5; font-size: 0.9rem; }

        /* 年份分隔 */
        .year-group {
            margin-bottom: 14px;
        }
        .year-group:last-child { margin-bottom: 0; }

        .year-group .year-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-main);
            padding: 4px 0 6px 4px;
            border-bottom: 2px solid rgba(122, 155, 181, 0.12);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .year-group .year-title i { color: #7a9bb5; font-size: 0.7rem; }
        .year-group .year-title .count {
            font-weight: 400;
            color: var(--text-sub);
            margin-left: auto;
            font-size: 0.65rem;
            background: rgba(122, 155, 181, 0.08);
            padding: 0 10px;
            border-radius: 20px;
        }

        /* 歷史項目 - 更精緻 */
        .history-item {
            background: #f5f7fa;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 6px;
            transition: all 0.2s ease;
            border: 1px solid rgba(180, 195, 210, 0.06);
        }
        .history-item:last-child { margin-bottom: 0; }
        .history-item:hover { background: #eef2f6; }

        .history-item .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }
        .history-item .storm-name { 
            font-weight: 600; 
            font-size: 0.9rem; 
            color: var(--text-main);
        }
        .history-item .detail-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.65rem;
            color: var(--text-sub);
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed rgba(180, 195, 210, 0.2);
        }
        .history-item .detail-row i { 
            width: 14px; 
            font-size: 0.6rem; 
            color: #7a9bb5; 
            margin-right: 2px;
        }
        .history-item .detail-row .detail-item {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .signal-tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #fff;
            flex-shrink: 0;
            letter-spacing: 0.3px;
        }
        .signal-8 { background: #f39c12; }
        .signal-9 { background: #e67e22; }
        .signal-10 { background: #c0392b; }
        .signal-other { background: #7a9bb5; }

        /* ===== 加載狀態 ===== */
        #loading {
            text-align: center;
            padding: 30px 0;
            color: var(--text-sub);
            font-size: 0.85rem;
        }
        #loading i { margin-right: 8px; }

        /* ===== 時間標籤 ===== */
        .time-label {
            text-align: center;
            font-size: 0.65rem;
            color: var(--text-sub);
            letter-spacing: 0.5px;
            padding-top: 2px;
        }

        /* ===== 空狀態 ===== */
        .empty-state {
            text-align: center;
            padding: 30px 0;
            color: var(--text-sub);
        }
        .empty-state i { 
            font-size: 2.5rem; 
            color: #d0d8e0; 
            margin-bottom: 10px; 
            display: block; 
        }
        .empty-state .sub-text {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        /* ===== 響應式 ===== */
        @media (max-width: 450px) {
            .storm-container { padding: 18px 14px 22px; }
            .history-item { padding: 8px 12px; }
            .storm-info-card .bottom-row { 
                flex-direction: column; 
                align-items: flex-start; 
                gap: 6px; 
            }
            .storm-info-card .bottom-row .right { 
                text-align: left; 
                width: 100%; 
            }
            .history-item .detail-row { gap: 8px; font-size: 0.6rem; }
            .history-item .storm-name { font-size: 0.85rem; }
            .year-group .year-title { font-size: 0.7rem; }
            .signal-tag { font-size: 0.6rem; padding: 1px 10px; }
        }
    </style>
</head>
<body>

    <div class="storm-container">

        <!-- ===== 🌀 風暴動畫（保留） ===== -->
        <div class="storm-animation">
            <svg viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg">
                <g class="spiral-ring">
                    <circle cx="50" cy="20" r="14" fill="none" stroke="#7a9bb5" stroke-width="1.5" opacity="0.15"/>
                    <circle cx="50" cy="20" r="10" fill="none" stroke="#7a9bb5" stroke-width="1.2" opacity="0.2"/>
                    <circle cx="50" cy="20" r="6" fill="none" stroke="#7a9bb5" stroke-width="0.8" opacity="0.25"/>
                </g>
                <line class="wind-line" x1="10" y1="14" x2="28" y2="14" stroke="#7a9bb5" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
                <line class="wind-line" x1="10" y1="20" x2="25" y2="20" stroke="#7a9bb5" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
                <line class="wind-line" x1="10" y1="26" x2="28" y2="26" stroke="#7a9bb5" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
                <g class="bird" transform="translate(10, 18)">
                    <ellipse cx="6" cy="4" rx="5" ry="3" fill="#7a9bb5" opacity="0.7"/>
                    <circle cx="11" cy="3" r="2.5" fill="#7a9bb5" opacity="0.7"/>
                    <circle cx="12" cy="2.5" r="0.8" fill="#3d525c"/>
                    <path d="M6,2 L2,-4 L5,-1 Z" fill="#8a9ba8" opacity="0.6"/>
                    <path d="M8,2 L4,-5 L7,-2 Z" fill="#8a9ba8" opacity="0.6"/>
                    <path d="M1,4 L-3,2 L-1,5 Z" fill="#8a9ba8" opacity="0.5"/>
                </g>
            </svg>
        </div>

        <!-- ===== Header 已隱藏 ===== -->

        <!-- ============================================================ -->
        <!-- 第一部分：風暴資訊（即時） -->
        <!-- ============================================================ -->
        <div class="storm-info-card" id="stormInfoCard">
            <div class="status-row">
                <span class="status-label">🌤️ 現時無熱帶氣旋</span>
                <span class="status-value no-storm" id="stormStatus">安全</span>
            </div>
            <hr class="divider">
            <div class="bottom-row">
                <div class="left">
                    <span class="sub" id="stormLocation">香港 800 公里範圍內無風暴</span>
                    <span class="sub" id="stormMovement" style="display:none;">移動：--</span>
                </div>
                <div class="right">
                    <div class="val" id="stormWind">0</div>
                    <div class="lbl">中心最高風力 (km/h)</div>
                </div>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- 第二部分：風暴檔案（歷史紀錄） -->
        <!-- ============================================================ -->
        <div class="history-card">
            <div class="history-title">
                <i class="fas fa-archive"></i> 📜 風暴歷史紀錄
            </div>
            <div id="historyList">
                <div id="loading"><i class="fas fa-spinner fa-pulse"></i> 載入中...</div>
            </div>
        </div>

        <div class="time-label" id="updateTimeLabel">— 數據更新 (--:--) —</div>
    </div>

    <script>
        (function() {
            // ============================================================
            // 第一部分：風暴檔案（歷史）
            // ============================================================
            const historyList = document.getElementById('historyList');
            const loadingEl = document.getElementById('loading');

            // 信號等級排序（8號最低，10號最高）
            const SIGNAL_ORDER = { '8': 0, '9': 1, '10': 2 };

            async function loadHistory() {
                const url = 'https://raw.githubusercontent.com/SeinorCopy/Weather_Sora/refs/heads/main/hk_typhoon_history.json';

                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('HTTP error: ' + response.status);
                    const data = await response.json();

                    if (!data || data.length === 0) {
                        loadingEl.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-cloud"></i>
                                暫時沒有風暴記錄
                                <div class="sub-text">稍後會自動更新</div>
                            </div>
                        `;
                        return;
                    }

                    // 按年份分組
                    const groups = {};
                    data.forEach(item => {
                        const year = item.year;
                        if (!groups[year]) groups[year] = [];
                        groups[year].push(item);
                    });

                    // 年份由新到舊排序
                    const sortedYears = Object.keys(groups).sort((a, b) => b - a);

                    let html = '';
                    sortedYears.forEach(year => {
                        const items = groups[year];
                        // 按信號等級排序（8 < 9 < 10）
                        items.sort((a, b) => {
                            const orderA = SIGNAL_ORDER[String(a.highest_signal)] ?? -1;
                            const orderB = SIGNAL_ORDER[String(b.highest_signal)] ?? -1;
                            return orderB - orderA; // 高信號排先
                        });

                        let itemsHtml = '';
                        items.forEach(item => {
                            let signalClass = 'signal-other';
                            let signalLabel = item.highest_signal + '號';
                            if (item.highest_signal >= 10) signalClass = 'signal-10';
                            else if (item.highest_signal >= 9) signalClass = 'signal-9';
                            else if (item.highest_signal >= 8) signalClass = 'signal-8';

                            // 格式化時間顯示
                            const hoisted = item.hoisted_time || '--';
                            const lowered = item.lowered_time || '--';
                            const duration = item.duration || '--';

                            itemsHtml += `
                                <div class="history-item">
                                    <div class="top-row">
                                        <span class="storm-name">${item.name}</span>
                                        <span class="signal-tag ${signalClass}">${signalLabel}</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-item"><i class="fas fa-flag-checkered"></i> 懸掛 ${hoisted}</span>
                                        <span class="detail-item"><i class="fas fa-flag"></i> 除下 ${lowered}</span>
                                        <span class="detail-item"><i class="fas fa-clock"></i> ${duration}</span>
                                    </div>
                                </div>
                            `;
                        });

                        html += `
                            <div class="year-group">
                                <div class="year-title">
                                    <i class="fas fa-calendar-alt"></i> ${year}
                                    <span class="count">${items.length} 個</span>
                                </div>
                                ${itemsHtml}
                            </div>
                        `;
                    });

                    historyList.innerHTML = html;
                    loadingEl.style.display = 'none';

                } catch (error) {
                    console.error('載入風暴檔案失敗：', error);
                    loadingEl.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            無法載入風暴檔案
                            <div class="sub-text">請檢查網絡連線後重試</div>
                        </div>
                    `;
                }
            }

            // ============================================================
            // 第二部分：即時風暴數據
            // ============================================================
            const stormStatusEl = document.getElementById('stormStatus');
            const stormLocationEl = document.getElementById('stormLocation');
            const stormMovementEl = document.getElementById('stormMovement');
            const stormWindEl = document.getElementById('stormWind');
            const updateTimeLabel = document.getElementById('updateTimeLabel');

            function getWindCategory(wind) {
                if (wind < 63) return '熱帶低氣壓';
                if (wind < 88) return '熱帶風暴';
                if (wind < 118) return '強烈熱帶風暴';
                if (wind < 150) return '颱風';
                if (wind < 185) return '強颱風';
                return '超強颱風';
            }

            function renderNoStorm(timeStr) {
                stormStatusEl.textContent = '安全';
                stormStatusEl.className = 'status-value no-storm';
                stormLocationEl.textContent = '香港 800 公里範圍內無風暴';
                stormMovementEl.style.display = 'none';
                stormWindEl.textContent = '0';
                updateTimeLabel.textContent = `— 數據更新 (${timeStr}) —`;
            }

            function renderStormInfo(tc, timeStr) {
                const wind = parseInt(tc.maxWind) || 0;
                const category = getWindCategory(wind);
                const lat = tc.latitude || '--';
                const lon = tc.longitude || '--';

                stormStatusEl.textContent = category;
                stormStatusEl.className = 'status-value';
                stormLocationEl.textContent = `位置：北緯 ${lat}° / 東經 ${lon}°`;

                if (tc.movement) {
                    stormMovementEl.style.display = 'block';
                    stormMovementEl.textContent = `移動：${tc.movement.direction} (${tc.movement.speed} km/h)`;
                } else {
                    stormMovementEl.style.display = 'none';
                }

                stormWindEl.textContent = wind;
                updateTimeLabel.textContent = `— 數據更新 (${timeStr}) —`;
            }

            async function fetchStormData() {
                try {
                    const response = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=tcInfo&lang=tc');
                    if (!response.ok) throw new Error('API Error');
                    const data = await response.json();

                    const updateTime = data.updateTime ? data.updateTime.slice(11, 16) : new Date().toTimeString().slice(0, 5);

                    if (data.tropicalCyclone && data.tropicalCyclone.length > 0) {
                        const tc = data.tropicalCyclone[0];
                        renderStormInfo(tc, updateTime);
                    } else {
                        renderNoStorm(updateTime);
                    }
                } catch (error) {
                    console.error('API 錯誤:', error);
                    renderNoStorm(new Date().toTimeString().slice(0, 5));
                }
            }

            // ============================================================
            // 啟動
            // ============================================================
            loadHistory();
            fetchStormData();
            setInterval(fetchStormData, 300000);
        })();
    </script>
</body>
</html>
