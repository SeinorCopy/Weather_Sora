<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時溫度分佈 · SORA HK</title>
    <style>
        :root {
            --bg-canvas: #f1f5f9;
            --bg-card: #ffffff;
            --border-card: rgba(226, 232, 240, 0.8);
            --text-main: #334155;
            --text-sub: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-canvas);
            color: var(--text-main);
            padding: 16px;
        }

        /* 手機版：滿版吃滿，不留大空白 */
        .modal-container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            background: var(--bg-canvas);
            border-radius: 24px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        /* 平板及電腦（螢幕寬度 > 600px）才限制寬度並置中 */
        @media (min-width: 600px) {
            .modal-container {
                max-width: 480px; 
            }
        }

        .card-box {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 16px;
            border: 1px solid var(--border-card);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        /* 1. 當前溫度概況 */
        .status-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-info h3 {
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            background: #e2e8f0;
            color: #475569;
            font-weight: 500;
        }

        .status-badge.hot {
            background: #ffedd5;
            color: #c2410c;
        }

        .status-badge.cool {
            background: #e0f2fe;
            color: #0369a1;
        }

        .status-sub {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* 2. 圖例欄 */
        .legend-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            font-size: 0.68rem;
            color: var(--text-sub);
        }

        .legend-pill {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; }

        /* 地圖區域 */
        .map-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .svg-container {
            width: 100%;
            height: auto;
            background: #f8fafc;
            border-radius: 16px;
            padding: 12px;
        }

        .district-poly {
            fill: #e2e8f0;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linejoin: round;
            transition: fill 0.3s ease;
        }

        .district-label {
            font-size: 11px;
            fill: #334155;
            font-weight: 600;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }

        .time-label {
            font-size: 0.7rem;
            color: var(--text-sub);
            margin-top: 10px;
            text-align: center;
        }

        /* 3. 各區氣溫排行榜 */
        .section-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .district-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .district-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .district-name {
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rank-tag {
            font-size: 0.65rem;
            padding: 1px 6px;
            border-radius: 6px;
            background: #e2e8f0;
            color: var(--text-sub);
        }

        .district-val {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-orange);
        }
    </style>
</head>
<body>

    <div class="modal-container">
        <!-- 1. 當前氣溫概況卡片 -->
        <div class="card-box status-card">
            <div class="status-info">
                <h3>溫 度 地 圖 <span class="status-badge hot" id="statusBadge">更新中...</span></h3>
                <div class="status-sub" id="statusSub">正在讀取天文台數據...</div>
            </div>
            <div style="text-align: right;">
                <div style="font-size: 1.1rem; font-weight: 700; color: var(--accent-orange);" id="maxVal">-- <span style="font-size:0.7rem;">°C</span></div>
                <div style="font-size: 0.65rem; color: var(--text-sub);">最高氣溫</div>
            </div>
        </div>

        <!-- 2. 地圖主卡片 -->
        <div class="card-box map-card">
            <div class="legend-row" style="margin-bottom: 12px;">
                <div class="legend-pill"><div class="dot" style="background:#3b82f6;"></div>西伯利亞</div>
                <div class="legend-pill"><div class="dot" style="background:#38bdf8;"></div>好鬼凍</div>
                <div class="legend-pill"><div class="dot" style="background:#22c55e;"></div>一般熱</div>
                <div class="legend-pill"><div class="dot" style="background:#f97316;"></div>熱</div>
                <div class="legend-pill"><div class="dot" style="background:#ef4444;"></div>勁熱</div>
            </div>

            <div class="svg-container">
              <svg viewBox="0 0 400 320" width="110%" height="100%">
                <!-- 新界西北 -->

                <text x="58" y="128" class="district-label">屯門</text>
            
                <path id="poly-元朗區" class="district-poly" d="M52,42 Q45,40 49,50 L55,78 Q57,83 62,82 L68,94 Q70,98 75,97 L108,97 Q113,97 112,92 L138,74 Q141,72 139,67 L131,32 Q130,27 125,27 L50,37 Q45,38 52,42 Z" />
                <text x="90" y="60" class="district-label">元朗</text>
            
                <path id="poly-北區" class="district-poly" d="M168,12 Q160,10 166,18 L150,77 Q148,82 153,82 L196,68 Q201,66 205,70 L242,68 Q248,66 244,60 L338,82 Q345,83 342,76 L348,12 Q349,5 342,5 L168,10 Q160,10 168,12 Z" />
                <text x="200" y="38" class="district-label">北區</text>
            
                <!-- 新界東 -->
                <path id="poly-大埔區" class="district-poly" d="M258,47 Q250,45 252,52 L246,72 Q245,77 250,77 L250,93 Q250,98 256,98 L278,102 Q283,103 284,98 L308,82 Q312,80 312,75 L318,48 Q319,44 314,44 L258,45 Q250,45 258,47 Z" />
                <text x="278" y="68" class="district-label">大埔</text>
            
                <path id="poly-沙田區" class="district-poly" d="M198,97 Q190,95 192,102 L186,118 Q184,123 189,125 L199,138 Q202,142 208,141 L238,141 Q244,141 244,136 L260,130 Q264,128 264,123 L262,94 Q262,89 257,89 L198,94 Q190,95 198,97 Z" />
                <text x="222" y="115" class="district-label">沙田</text>
            
                <path id="poly-西貢區" class="district-poly" d="M278,102 Q270,100 272,108 L260,148 Q258,153 264,153 L308,176 Q313,178 316,173 L343,152 Q347,150 347,144 L358,102 Q359,98 354,98 L278,100 Q270,100 278,102 Z" />
                <text x="310" y="135" class="district-label">西貢</text>
            
                <!-- 新界西南 -->
                <path id="poly-荃灣區" class="district-poly" d="M113,117 Q105,115 107,122 L100,128 Q97,132 101,135 L118,145 Q122,147 127,146 L153,146 Q158,146 158,141 L164,132 Q166,128 163,125 L155,107 Q153,103 148,104 L113,112 Q105,115 113,117 Z" />
                <text x="130" y="126" class="district-label">荃灣</text>
            
                <path id="poly-葵青區" class="district-poly" d="M138,144 Q130,142 132,148 L126,163 Q124,168 129,168 L153,171 Q158,172 160,168 L178,161 Q182,160 180,155 L176,140 Q175,136 170,136 L138,140 Q130,142 138,144 Z" />
                <text x="150" y="155" class="district-label">葵青</text>
            
                <!-- 九龍 -->
                <path id="poly-深水埗區" class="district-poly" d="M128,172 Q120,170 122,176 L139,193 Q142,196 147,196 L173,191 Q178,190 178,185 L178,170 Q178,166 173,166 L128,168 Q120,170 128,172 Z" />
                <text x="155" y="183" class="district-label">深水埗</text>
            
                <path id="poly-油尖旺區" class="district-poly" d="M172,197 Q165,195 167,201 L161,216 Q159,220 164,220 L193,216 Q198,215 198,210 L198,195 Q198,191 193,191 L172,193 Q165,195 172,197 Z" />
                <text x="180" y="206" class="district-label">油尖旺</text>
            
                <path id="poly-九龍城區" class="district-poly" d="M192,172 Q185,170 187,176 L189,190 Q190,194 195,194 L198,193 Q203,192 207,194 L233,199 Q238,200 240,196 L244,177 Q245,173 240,172 L192,170 Q185,170 192,172 Z" />
                <text x="215" y="185" class="district-label">九龍城</text>
            
                <path id="poly-黃大仙區" class="district-poly" d="M227,142 Q220,140 222,146 L216,163 Q214,168 219,168 L233,172 Q237,173 240,170 L250,165 Q253,163 253,158 L256,142 Q256,138 251,138 L227,140 Q220,140 227,142 Z" />
                <text x="235" y="153" class="district-label">黃大仙</text>
            
                <path id="poly-觀塘區" class="district-poly" d="M257,170 Q250,168 252,174 L246,198 Q244,203 249,203 L283,202 Q288,202 288,197 L294,172 Q295,168 290,168 L257,168 Q250,168 257,170 Z" />
                <text x="270" y="185" class="district-label">觀塘</text>
            
                <!-- 港島 -->
                <path id="poly-中西區" class="district-poly" d="M132,237 Q125,235 127,242 L135,262 Q137,266 142,266 L183,259 Q188,258 187,253 L182,232 Q181,228 176,228 L132,233 Q125,235 132,237 Z" />
                <text x="155" y="248" class="district-label">中西區</text>
            
                <path id="poly-灣仔區" class="district-poly" d="M195,234 Q188,232 190,238 L189,257 Q189,261 194,261 L216,259 Q220,259 220,254 L221,234 Q221,230 216,230 L195,232 Q188,232 195,234 Z" />
                <text x="203" y="246" class="district-label">灣仔</text>
            
                <path id="poly-東區" class="district-poly" d="M232,230 Q225,228 227,234 L222,258 Q221,263 226,263 L269,265 Q274,265 275,260 L281,231 Q282,227 277,227 L232,228 Q225,228 232,230 Z" />
                <text x="250" y="248" class="district-label">東區</text>
            
                <path id="poly-南區" class="district-poly" d="M142,270 Q135,268 137,274 L145,298 Q147,302 152,302 L212,299 Q217,299 217,294 L224,266 Q225,262 220,262 L142,265 Q135,268 142,270 Z" />
                <text x="180" y="285" class="district-label">南區</text>
            
                <!-- 離島 -->
                <path id="poly-離島區" class="district-poly" d="M22,182 Q15,180 16,188 L10,228 Q10,234 15,234 L20,278 Q21,283 26,283 L88,260 Q92,259 91,254 L114,230 Q117,227 113,224 L109,192 Q108,187 103,187 L22,178 Q15,180 22,182 Z" />
                <text x="60" y="235" class="district-label">離島</text>
            
                <!-- 將軍澳 -->
                <path id="poly-將軍澳" class="district-poly" d="M297,172 Q290,170 292,176 L281,196 Q279,201 284,201 L323,200 Q328,200 328,195 L334,177 Q335,173 330,172 L297,170 Q290,170 297,172 Z" />
                <text x="308" y="188" class="district-label">將軍澳</text>
              </svg>
            </div>

            <div class="time-label" id="mapTimeLabel">— 實時氣溫數據更新中... —</div>
        </div>

        <!-- 3. 各區氣溫排行榜卡片 -->
        <div class="card-box">
            <div class="section-title">
                <span>📍 各區氣溫排行榜</span>
                <span class="status-badge" style="background:#dbeafe; color:#1e40af;">天文台實時</span>
            </div>
            
            <div class="district-list" id="districtList"></div>
        </div>
    </div>

    <script>
        const districtData = {
            '離島區': null, '葵青區': null, '北區': null, '沙田區': null, '西貢區': null, 
            '大埔區': null, '荃灣區': null, '屯門區': null, '元朗區': null, '九龍城區': null, 
            '觀塘區': null, '深水埗區': null, '黃大仙區': null, '油尖旺區': null, '中西區': null, 
            '東區': null, '南區': null, '灣仔區': null, '將軍澳': null
        };

        // 天文台測站名稱轉 18 區名稱對照表
        const placeToDistrict = {
            '香港天文台': '油尖旺區', '京士柏': '油尖旺區', '黃竹坑': '南區',
            '打鼓嶺': '北區', '流浮山': '元朗區', '大埔': '大埔區',
            '沙田': '沙田區', '屯門': '屯門區', '西貢': '西貢區',
            '將軍澳': '將軍澳', '荃灣可觀': '荃灣區', '荃灣城門谷': '荃灣區',
            '香港公園': '中西區', '筲箕灣': '東區', '九龍城': '九龍城區',
            '跑馬地': '灣仔區', '黃大仙': '黃大仙區', '赤鱲角': '離島區',
            '長洲': '離島區', '坪洲': '離島區', '觀塘': '觀塘區',
            '深水埗': '深水埗區', '青衣': '葵青區', '大美督': '大埔區'
        };

        // 氣溫顏色對應邏輯
        function getColor(temp) {
            if (temp === null || isNaN(temp)) return '#e2e8f0'; // 無數據
            if (temp < 17) return '#3b82f6';  // 寒冷 (藍)
            if (temp < 20) return '#81f7f3';  // 涼爽 (淺藍)
            if (temp < 26) return '#d2f781';  // 舒適 (綠)
            if (temp < 30) return '#f99316';  // 偏熱 (橙)
            return '#ef4444';                  // 酷熱 (紅)
        }

        function updateUI(timeStr) {
            let max = -999;
            let maxNameList = [];
            let validDistrictCount = 0;

            // 1. 更新地圖顏色與尋找最高溫
            for (const name in districtData) {
                const val = districtData[name];
                
                const poly = document.getElementById(`poly-${name}`);
                if (poly) poly.style.fill = getColor(val);

                if (val !== null && !isNaN(val)) {
                    validDistrictCount++;
                    if (val > max) {
                        max = val;
                        maxNameList = [name];
                    } else if (val === max) {
                        maxNameList.push(name);
                    }
                }
            }

            // 2. 更新狀態卡片
            const maxValEl = document.getElementById('maxVal');
            const statusBadgeEl = document.getElementById('statusBadge');
            const statusSubEl = document.getElementById('statusSub');

            if (validDistrictCount > 0) {
                maxValEl.innerHTML = `${max} <span style="font-size:0.7rem;">°C</span>`;
                
                if (max >= 33) {
                    statusBadgeEl.textContent = '酷熱';
                    statusBadgeEl.className = 'status-badge hot';
                } else if (max >= 28) {
                    statusBadgeEl.textContent = '偏熱';
                    statusBadgeEl.className = 'status-badge hot';
                } else if (max >= 22) {
                    statusBadgeEl.textContent = '宜人';
                    statusBadgeEl.className = 'status-badge cool';
                } else {
                    statusBadgeEl.textContent = '清涼';
                    statusBadgeEl.className = 'status-badge cool';
                }

                statusSubEl.textContent = `最高溫地區：${maxNameList.join('、')}`;
            } else {
                maxValEl.innerHTML = `-- <span style="font-size:0.7rem;">°C</span>`;
                statusBadgeEl.textContent = '無數據';
                statusSubEl.textContent = '暫時未能取得氣溫數據';
            }

            document.getElementById('mapTimeLabel').textContent = `— 實時氣溫 (${timeStr} 更新) —`;

            // 3. 排行榜排序（由高溫至低溫）
            const sortedDistricts = Object.entries(districtData)
                .filter(([_, val]) => val !== null)
                .sort((a, b) => b[1] - a[1]);

            document.getElementById('districtList').innerHTML = sortedDistricts.map(([name, val], index) => `
                <div class="district-item">
                    <div class="district-name">
                        <span class="rank-tag">${index + 1}</span> ${name}
                    </div>
                    <div class="district-val" style="color:${getColor(val)}">${val} °C</div>
                </div>
            `).join('');
        }

        async function fetchRealTemperature() {
            try {
                const response = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_t=${Date.now()}`);
                if (!response.ok) throw new Error('API Error');

                const data = await response.json();
                
                // 重置所有地區數值
                for (const key in districtData) districtData[key] = null;

                // 解析天文台實時氣溫數據
                if (data.temperature && data.temperature.data) {
                    data.temperature.data.forEach(item => {
                        const rawPlace = item.place;
                        const tempVal = parseFloat(item.value);

                        if (!isNaN(tempVal)) {
                            // 比對對照表，將氣象站映照至對應區域
                            let targetDistrict = placeToDistrict[rawPlace];
                            
                            // 若無對照但名稱自帶「區」，直接匹配
                            if (!targetDistrict && rawPlace.endsWith('區')) {
                                targetDistrict = rawPlace;
                            }

                            if (targetDistrict && districtData.hasOwnProperty(targetDistrict)) {
                                // 如果區域已有數據（例如油尖旺有多個站），保留較高者或最新者
                                if (districtData[targetDistrict] === null || tempVal > districtData[targetDistrict]) {
                                    districtData[targetDistrict] = tempVal;
                                }
                            }
                        }
                    });
                }

                // 取得資料更新時間
                let dataTime = '--:--';
                if (data.recordTime) {
                    dataTime = data.recordTime.slice(11, 16);
                } else if (data.updateTime) {
                    dataTime = data.updateTime.slice(11, 16);
                }

                updateUI(dataTime);

            } catch (error) {
                console.error('Fetch temperature Error:', error);
                const now = new Date();
                const fallbackTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                updateUI(fallbackTime);
            }
        }

        // 1. 頁面載入時執行
        fetchRealTemperature();

        // 2. 每 3 分鐘自動更新一次
        setInterval(fetchRealTemperature, 180000);
    </script>
</body>
</html>
