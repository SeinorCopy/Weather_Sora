<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時溫度分佈 · SORA HK</title>
    <style>
        :root {
            --bg-canvas: #f1f5f9;
            --bg-card: #ffffff;
            --border-card: rgba(226, 232, 240, 0.8);
            --text-main: #334155;
            --text-sub: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-canvas);
            color: var(--text-main);
            padding: 16px;
        }

        /* 手機版：滿版吃滿，不留大空白 */
        .modal-container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            background: var(--bg-canvas);
            border-radius: 24px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        /* 平板及電腦（螢幕寬度 > 600px）才限制寬度並置中 */
        @media (min-width: 600px) {
            .modal-container {
                max-width: 480px; 
            }
        }

        .card-box {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 16px;
            border: 1px solid var(--border-card);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        /* 1. 當前溫度概況 */
        .status-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-info h3 {
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            background: #e2e8f0;
            color: #475569;
            font-weight: 500;
        }

        .status-badge.hot {
            background: #ffedd5;
            color: #c2410c;
        }

        .status-badge.cool {
            background: #e0f2fe;
            color: #0369a1;
        }

        .status-sub {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* 2. 圖例欄 */
        .legend-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            font-size: 0.68rem;
            color: var(--text-sub);
        }

        .legend-pill {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; }

        /* 地圖區域 */
        .map-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .svg-container {
            width: 100%;
            height: auto;
            background: #f8fafc;
            border-radius: 16px;
            padding: 12px;
        }

        .district-poly {
            fill: #e2e8f0;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linejoin: round;
            transition: fill 0.3s ease;
        }

        .district-label {
            font-size: 11px;
            fill: #334155;
            font-weight: 600;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }

        .time-label {
            font-size: 0.7rem;
            color: var(--text-sub);
            margin-top: 10px;
            text-align: center;
        }

        /* 3. 各區氣溫排行榜 */
        .section-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .district-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .district-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .district-name {
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rank-tag {
            font-size: 0.65rem;
            padding: 1px 6px;
            border-radius: 6px;
            background: #e2e8f0;
            color: var(--text-sub);
        }

        .district-val {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-orange);
        }
    </style>
</head>
<body>

    <div class="modal-container">
        <!-- 1. 當前氣溫概況卡片 -->
        <div class="card-box status-card">
            <div class="status-info">
                <h3>溫 度 地 圖 <span class="status-badge hot" id="statusBadge">更新中...</span></h3>
                <div class="status-sub" id="statusSub">正在讀取天文台數據...</div>
            </div>
            <div style="text-align: right;">
                <div style="font-size: 1.1rem; font-weight: 700; color: var(--accent-orange);" id="maxVal">-- <span style="font-size:0.7rem;">°C</span></div>
                <div style="font-size: 0.65rem; color: var(--text-sub);">最高氣溫</div>
            </div>
        </div>

        <!-- 2. 地圖主卡片 -->
        <div class="card-box map-card">
            <div class="legend-row" style="margin-bottom: 12px;">
                <div class="legend-pill"><div class="dot" style="background:#3b82f6;"></div>西伯利亞</div>
                <div class="legend-pill"><div class="dot" style="background:#38bdf8;"></div>好鬼凍</div>
                <div class="legend-pill"><div class="dot" style="background:#22c55e;"></div>少少凍</div>
                <div class="legend-pill"><div class="dot" style="background:#f97316;"></div>凍凍地</div>
                <div class="legend-pill"><div class="dot" style="background:#ef4444;"></div>唔凍</div>
            </div>

            <div class="svg-container">
                <svg viewBox="0 0 400 320" width="100%" height="100%">
                <!-- 新界西北 -->
                <polygon id="poly-屯門區" class="district-poly" points="30,110 70,95 90,110 85,150 50,160 25,140" />
                <text x="58" y="128" class="district-label">屯門</text>
            
                <polygon id="poly-元朗區" class="district-poly" points="45,40 130,30 140,70 110,95 70,95 50,80" />
                <text x="90" y="60" class="district-label">元朗</text>
            
                <polygon id="poly-北區" class="district-poly" points="160,10 350,5 245,65 340,80 200,65 145,80" />
                <text x="200" y="38" class="district-label">北區</text>
            
                <!-- 新界東 -->
                <polygon id="poly-大埔區" class="district-poly" points="250,45 320,45 310,80 280,100 250,95 245,70" />
                <text x="278" y="68" class="district-label">大埔</text>
            
                <polygon id="poly-沙田區" class="district-poly" points="190,95 260,90 260,130 240,140 200,140 185,120" />
                <text x="222" y="115" class="district-label">沙田</text>
            
                <polygon id="poly-西貢區" class="district-poly" points="270,100 360,100 345,150 310,175 260,150" />
                <text x="310" y="135" class="district-label">西貢</text>
            
                <!-- 新界西南 -->
                <polygon id="poly-荃灣區" class="district-poly" points="105,115 155,105 165,130 155,145 120,145 100,130" />
                <text x="130" y="126" class="district-label">荃灣</text>
            
                <polygon id="poly-葵青區" class="district-poly" points="130,142 175,138 180,160 155,170 125,165" />
                <text x="150" y="155" class="district-label">葵青</text>
            
                <!-- 九龍 -->
                <polygon id="poly-深水埗區" class="district-poly" points="120,170 180,168 175,190 140,195" />
                <text x="155" y="183" class="district-label">深水埗</text>
            
                <polygon id="poly-油尖旺區" class="district-poly" points="165,195 200,193 195,215 160,218" />
                <text x="180" y="206" class="district-label">油尖旺</text>
            
                <polygon id="poly-九龍城區" class="district-poly" points="185,170 245,175 235,200 200,195 190,192" />
                <text x="215" y="185" class="district-label">九龍城</text>
            
                <polygon id="poly-黃大仙區" class="district-poly" points="220,140 255,140 250,165 235,172 215,165" />
                <text x="235" y="153" class="district-label">黃大仙</text>
            
                <polygon id="poly-觀塘區" class="district-poly" points="250,168 295,170 285,200 245,200" />
                <text x="270" y="185" class="district-label">觀塘</text>
            
                <!-- 港島 -->
                <polygon id="poly-中西區" class="district-poly" points="125,235 180,230 185,258 135,265" />
                <text x="155" y="248" class="district-label">中西區</text>
            
                <polygon id="poly-灣仔區" class="district-poly" points="188,232 220,232 218,258 188,260" />
                <text x="203" y="246" class="district-label">灣仔</text>
            
                <polygon id="poly-東區" class="district-poly" points="225,228 280,230 270,265 222,260" />
                <text x="250" y="248" class="district-label">東區</text>
            
                <polygon id="poly-南區" class="district-poly" points="135,268 225,265 215,300 145,300" />
                <text x="180" y="285" class="district-label">南區</text>
            
                <!-- 離島 -->
                <polygon id="poly-離島區" class="district-poly" points="15,180 110,190 115,230 90,260 20,280 10,230" />
                <text x="60" y="235" class="district-label">離島</text>
            
                <!-- 將軍澳 -->
                <polygon id="poly-將軍澳" class="district-poly" points="290,170 335,175 325,200 280,198" />
                <text x="308" y="188" class="district-label">將軍澳</text>
            </svg>  
            </div>

            <div class="time-label" id="mapTimeLabel">— 實時氣溫數據更新中... —</div>
        </div>

        <!-- 3. 各區氣溫排行榜卡片 -->
        <div class="card-box">
            <div class="section-title">
                <span>📍 各區氣溫排行榜</span>
                <span class="status-badge" style="background:#dbeafe; color:#1e40af;">天文台實時</span>
            </div>
            
            <div class="district-list" id="districtList"></div>
        </div>
    </div>

    <script>
        const districtData = {
            '離島區': null, '葵青區': null, '北區': null, '沙田區': null, '西貢區': null, 
            '大埔區': null, '荃灣區': null, '屯門區': null, '元朗區': null, '九龍城區': null, 
            '觀塘區': null, '深水埗區': null, '黃大仙區': null, '油尖旺區': null, '中西區': null, 
            '東區': null, '南區': null, '灣仔區': null, '將軍澳': null
        };

        // 天文台測站名稱轉 18 區名稱對照表
        const placeToDistrict = {
            '香港天文台': '油尖旺區', '京士柏': '油尖旺區', '黃竹坑': '南區',
            '打鼓嶺': '北區', '流浮山': '元朗區', '大埔': '大埔區',
            '沙田': '沙田區', '屯門': '屯門區', '西貢': '西貢區',
            '將軍澳': '將軍澳', '荃灣可觀': '荃灣區', '荃灣城門谷': '荃灣區',
            '香港公園': '中西區', '筲箕灣': '東區', '九龍城': '九龍城區',
            '跑馬地': '灣仔區', '黃大仙': '黃大仙區', '赤鱲角': '離島區',
            '長洲': '離島區', '坪洲': '離島區', '觀塘': '觀塘區',
            '深水埗': '深水埗區', '青衣': '葵青區', '大美督': '大埔區'
        };

        // 氣溫顏色對應邏輯
        function getColor(temp) {
            if (temp === null || isNaN(temp)) return '#e2e8f0'; // 無數據
            if (temp < 17) return '#3b82f6';  // 寒冷 (藍)
            if (temp < 20) return '#81f7f3';  // 涼爽 (淺藍)
            if (temp < 26) return '#d2f781';  // 舒適 (綠)
            if (temp < 30) return '#f99316';  // 偏熱 (橙)
            return '#ef4444';                  // 酷熱 (紅)
        }

        function updateUI(timeStr) {
            let max = -999;
            let maxNameList = [];
            let validDistrictCount = 0;

            // 1. 更新地圖顏色與尋找最高溫
            for (const name in districtData) {
                const val = districtData[name];
                
                const poly = document.getElementById(`poly-${name}`);
                if (poly) poly.style.fill = getColor(val);

                if (val !== null && !isNaN(val)) {
                    validDistrictCount++;
                    if (val > max) {
                        max = val;
                        maxNameList = [name];
                    } else if (val === max) {
                        maxNameList.push(name);
                    }
                }
            }

            // 2. 更新狀態卡片
            const maxValEl = document.getElementById('maxVal');
            const statusBadgeEl = document.getElementById('statusBadge');
            const statusSubEl = document.getElementById('statusSub');

            if (validDistrictCount > 0) {
                maxValEl.innerHTML = `${max} <span style="font-size:0.7rem;">°C</span>`;
                
                if (max >= 33) {
                    statusBadgeEl.textContent = '酷熱';
                    statusBadgeEl.className = 'status-badge hot';
                } else if (max >= 28) {
                    statusBadgeEl.textContent = '偏熱';
                    statusBadgeEl.className = 'status-badge hot';
                } else if (max >= 22) {
                    statusBadgeEl.textContent = '宜人';
                    statusBadgeEl.className = 'status-badge cool';
                } else {
                    statusBadgeEl.textContent = '清涼';
                    statusBadgeEl.className = 'status-badge cool';
                }

                statusSubEl.textContent = `最高溫地區：${maxNameList.join('、')}`;
            } else {
                maxValEl.innerHTML = `-- <span style="font-size:0.7rem;">°C</span>`;
                statusBadgeEl.textContent = '無數據';
                statusSubEl.textContent = '暫時未能取得氣溫數據';
            }

            document.getElementById('mapTimeLabel').textContent = `— 實時氣溫 (${timeStr} 更新) —`;

            // 3. 排行榜排序（由高溫至低溫）
            const sortedDistricts = Object.entries(districtData)
                .filter(([_, val]) => val !== null)
                .sort((a, b) => b[1] - a[1]);

            document.getElementById('districtList').innerHTML = sortedDistricts.map(([name, val], index) => `
                <div class="district-item">
                    <div class="district-name">
                        <span class="rank-tag">${index + 1}</span> ${name}
                    </div>
                    <div class="district-val" style="color:${getColor(val)}">${val} °C</div>
                </div>
            `).join('');
        }

        async function fetchRealTemperature() {
            try {
                const response = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_t=${Date.now()}`);
                if (!response.ok) throw new Error('API Error');

                const data = await response.json();
                
                // 重置所有地區數值
                for (const key in districtData) districtData[key] = null;

                // 解析天文台實時氣溫數據
                if (data.temperature && data.temperature.data) {
                    data.temperature.data.forEach(item => {
                        const rawPlace = item.place;
                        const tempVal = parseFloat(item.value);

                        if (!isNaN(tempVal)) {
                            // 比對對照表，將氣象站映照至對應區域
                            let targetDistrict = placeToDistrict[rawPlace];
                            
                            // 若無對照但名稱自帶「區」，直接匹配
                            if (!targetDistrict && rawPlace.endsWith('區')) {
                                targetDistrict = rawPlace;
                            }

                            if (targetDistrict && districtData.hasOwnProperty(targetDistrict)) {
                                // 如果區域已有數據（例如油尖旺有多個站），保留較高者或最新者
                                if (districtData[targetDistrict] === null || tempVal > districtData[targetDistrict]) {
                                    districtData[targetDistrict] = tempVal;
                                }
                            }
                        }
                    });
                }

                // 取得資料更新時間
                let dataTime = '--:--';
                if (data.recordTime) {
                    dataTime = data.recordTime.slice(11, 16);
                } else if (data.updateTime) {
                    dataTime = data.updateTime.slice(11, 16);
                }

                updateUI(dataTime);

            } catch (error) {
                console.error('Fetch temperature Error:', error);
                const now = new Date();
                const fallbackTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                updateUI(fallbackTime);
            }
        }

        // 1. 頁面載入時執行
        fetchRealTemperature();

        // 2. 每 3 分鐘自動更新一次
        setInterval(fetchRealTemperature, 180000);
    </script>
</body>
</html>
